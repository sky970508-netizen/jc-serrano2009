 (22)."]],"w":32},{"k":"fccb7f46","o":132,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"Because of its local approach, our filter mixes both types in the backbones, where simultaneously big hubs coexist—like the Predatory Shrimp, which in the complete network approximately has an average number of incoming connections and the maximum number of outgoing ones, 13 and 61, respectively—with more modest species in terms of connections—like Benthic Flagellates, with in-degree 1 and out-degree 10, both below the average.","ko":"그 국소적 접근법 덕분에 우리의 필터는 백본에서 두 유형을 혼합하는데, 여기서는 완전한 네트워크에서 각각 약 13개와 61개로 평균 수준의 들어오는 연결과 최대 수준의 나가는 연결을 지닌 포식성 새우(Predatory Shrimp) 같은 큰 허브가, 들어오는 차수 1과 나가는 차수 10으로 둘 다 평균 이하인 저서 편모충(Benthic Flagellates) 같은 연결의 관점에서 더 소박한 종과 동시에 공존한다.","c":[[1,"Because of its local approach,"],[0,"our filter mixes both types in the backbones,"],[1,"where simultaneously big hubs coexist"],[2,"—like the Predatory Shrimp, which in the complete network approximately has an average number of incoming connections and the maximum number of outgoing ones, 13 and 61, respectively—"],[1,"with more modest species in terms of connections"],[2,"—like Benthic Flagellates, with in-degree 1 and out-degree 10, both below the average."]],"w":64,"skel":"our filter mixes both types … where big hubs coexist with more modest species","fx":1},{"k":"c66b1a6e","o":133,"s":"결론 (Conclusions)","en":"The disparity filter exploits local heterogeneity and local correlations among weights to extract the network backbone by considering the relevant edges at all the scales present in the system.","ko":"격차 필터는 시스템에 존재하는 모든 스케일에서 유의미한 엣지를 고려함으로써 네트워크 백본을 추출하기 위해 국소 이질성과 가중치 간의 국소 상관을 활용한다.","c":[[0,"The disparity filter exploits local heterogeneity and local correlations among weights to extract the network backbone by considering the relevant edges at all the scales present in the system."]],"w":29},{"k":"1d086d29","o":134,"s":"결론 (Conclusions)","en":"The methodology preserves an edge whenever its intensity is statistically not compatible with respect to a null hypothesis of uniform randomness for at least one of the two nodes the edge is incident to, which ensures that small nodes in terms of strength are not neglected.","ko":"이 방법론은 엣지가 접한 두 노드 중 적어도 하나에 대해 그 세기가 균등 무작위성의 귀무 가설에 통계적으로 양립하지 않을 때마다 그 엣지를 보존하며, 이는 강도의 관점에서 작은 노드가 무시되지 않도록 보장한다.","c":[[0,"The methodology preserves an edge"],[1,"whenever its intensity is statistically not compatible with respect to a null hypothesis of uniform randomness"],[2,"for at least one of the two nodes the edge is incident to,"],[1,"which ensures"],[2,"that small nodes in terms of strength are not neglected."]],"w":46,"skel":"The methodology preserves an edge whenever its intensity is not compatible …","fx":1},{"k":"8601e4ea","o":135,"s":"결론 (Conclusions)","en":"As a result, the disparity filter reduces the number of edges in the original network significantly, keeping, at the same time, almost all of the weight and a large fraction of nodes.","ko":"그 결과, 격차 필터는 원래 네트워크의 엣지 수를 유의하게 줄이는 동시에 거의 모든 가중치와 큰 비율의 노드를 유지한다.","c":[[0,"As a result"],[0,"the disparity filter reduces the number of edges in the original network significantly, keeping"],[1,"at the same time"],[1,"almost all of the weight and a large fraction of nodes."]],"w":32},{"k":"4cbe67ec","o":136,"s":"결론 (Conclusions)","en":"As well, this filter preserves the cutoff of the degree distribution, the form of the weight distribution, and the clustering coefficient.","ko":"또한 이 필터는 차수 분포의 절단, 가중치 분포의 형태, 그리고 뭉침 계수를 보존한다.","c":[[0,"As well, this filter preserves the cutoff of the degree distribution, the form of the weight distribution"],[1,"and the clustering coefficient."]],"w":21},{"k":"21360632","o":137,"s":"결론 (Conclusions)","en":"As a criticism, one could say that it only works in the case of systems with strong disorder, where the weights are heterogeneously distributed both at the global and local level.","ko":"비판으로서, 이것이 가중치가 전역 및 국소 수준 모두에서 이질적으로 분포하는 강한 무질서 시스템의 경우에만 작동한다고 말할 수 있을 것이다.","c":[[0,"As a criticism"],[1,"one could say"],[2,"that it only works in the case of systems with strong disorder"],[3,"where the weights are heterogeneously distributed both at the global and local level."]],"w":31},{"k":"7f008795","o":138,"s":"결론 (Conclusions)","en":"Nevertheless, all filters present limitations; one has to take them into account in relation to the problem under analysis.","ko":"그럼에도 불구하고 모든 필터는 한계를 지니며, 분석 대상 문제와 관련하여 이를 고려해야 한다.","c":[[0,"Nevertheless, all filters present limitations"],[1,"one has to take them into account in relation to the problem under analysis."]],"w":19},{"k":"3ee5f4bb","o":139,"s":"결론 (Conclusions)","en":"Which strategy is the most appropriate for a particular problem should be carefully judged and we cannot exclude the possibility that a combination of different techniques turns out to be the most appropriate.","ko":"특정 문제에 어떤 전략이 가장 적절한지는 신중하게 판단되어야 하며, 서로 다른 기법의 조합이 가장 적절한 것으로 판명될 가능성을 배제할 수 없다.","c":[[0,"Which strategy is the most appropriate for a particular problem should be carefully judged and we cannot exclude the possibility"],[2,"that a combination of different techniques turns out to be the most appropriate."]],"w":33},{"k":"069ce1fe","o":140,"s":"결론 (Conclusions)","en":"Yet, the ubiquitous presence of fluctuations and disorder spanning many length scales uncovered in many real networks provides a wide range of potential applications for the present methodology in biology (metabolic networks, brain, periodically regulated genes), information technology (Internet, World Wide Web), economics (World Trade Web), and finance (stock markets).","ko":"그러나 많은 실제 네트워크에서 밝혀진, 여러 길이 스케일에 걸친 요동과 무질서의 편재하는 존재는, 생물학(대사 네트워크, 뇌, 주기적으로 조절되는 유전자), 정보 기술(인터넷, 월드 와이드 웹), 경제학(세계 무역 웹), 그리고 금융(주식 시장)에서 본 방법론에 대한 광범위한 잠재적 응용을 제공한다.","c":[[0,"Yet, the ubiquitous presence of fluctuations and disorder"],[1,"spanning many length scales uncovered in many real networks"],[0,"provides a wide range of potential applications for the present methodology"],[1,"in biology (metabolic networks, brain, periodically regulated genes),"],[1,"information technology (Internet, World Wide Web),"],[1,"economics (World Trade Web), and finance (stock markets)."]],"w":50,"skel":"the presence of fluctuations and disorder … provides a wide range of applications","fx":1},{"k":"3c8f6a72","o":141,"s":"엣지 가중치의 국소 이질성 (Local Heterogeneity of Edges' Weight)","en":"To assess the effect of inhomogeneities in the weights at the local level, for each node i with k neighbors one can calculate the function (17, 18)","ko":"국소 수준에서 가중치의 비균질성의 효과를 평가하기 위해, k개의 이웃을 지닌 각 노드 i에 대해 다음 함수를 계산할 수 있다 (17, 18).","c":[[0,"To assess the effect of inhomogeneities in the weights at the local level"],[1,"for each node i with k neighbors one can calculate the function (17, 18)"]],"w":27},{"k":"7ef713c2","o":142,"s":"엣지 가중치의 국소 이질성 (Local Heterogeneity of Edges' Weight)","en":"The function Yi(k) has been extensively used in several fields as a standard indicator of concentration for more than half a century: in ecology (23), economics (24, 25), physics (26), and recently in the complex networks literature where it is known as the disparity measure (17).","ko":"함수 Yi(k)는 반세기가 넘도록 집중도(concentration)의 표준 지표로서 여러 분야에서 광범위하게 사용되어 왔는데, 생태학 (23), 경제학 (24, 25), 물리학 (26), 그리고 최근에는 격차 척도(disparity measure)로 알려진 복잡 네트워크 문헌 (17)에서 그러하다.","c":[[0,"The function Yi(k) has been extensively used in several fields as a standard indicator of concentration for more than half a century:"],[1,"in ecology (23), economics (24, 25), physics (26),"],[1,"and recently in the complex networks literature"],[2,"where it is known as the disparity measure (17)."]],"w":46,"skel":"The function Yi(k) has been used … as a standard indicator of concentration","fx":1},{"k":"5e0964c7","o":143,"s":"엣지 가중치의 국소 이질성 (Local Heterogeneity of Edges' Weight)","en":"In all cases, Yi(k) characterizes the level of local heterogeneity.","ko":"모든 경우에 Yi(k)는 국소 이질성의 수준을 특징짓는다.","c":[[0,"In all cases, Yi(k) characterizes the level of local heterogeneity."]],"w":10},{"k":"d0f0bdc8","o":144,"s":"엣지 가중치의 국소 이질성 (Local Heterogeneity of Edges' Weight)","en":"Under perfect homogeneity, when all the links share the same amount of the strength of the node, ϒi(k) equals 1 independently of k, while in the case of perfect heterogeneity, when just one of the links carries the whole strength of the node, this function is ϒi(k) = k.","ko":"완전한 균질성 하에서 모든 링크가 노드 강도의 동일한 양을 공유할 때 ϒi(k)는 k와 무관하게 1이 되는 반면, 완전한 이질성의 경우 링크 중 단 하나가 노드의 전체 강도를 담당할 때 이 함수는 ϒi(k) = k가 된다.","c":[[1,"Under perfect homogeneity,"],[2,"when all the links share the same amount of the strength of the node,"],[0,"ϒi(k) equals 1 independently of k,"],[1,"while in the case of perfect heterogeneity,"],[2,"when just one of the links carries the whole strength of the node,"],[1,"this function is ϒi(k) = k."]],"w":49,"skel":"ϒi(k) equals 1 …, while … this function is ϒi(k) = k","fx":1},{"k":"2ff595a9","o":145,"s":"엣지 가중치의 국소 이질성 (Local Heterogeneity of Edges' Weight)","en":"An intermediate behavior is usually observed in real systems with ϒi(k) ∝ kα and the exponent close to 1/2.","ko":"실제 시스템에서는 보통 ϒi(k) ∝ k^α이고 지수가 1/2에 가까운 중간적 거동이 관찰된다.","c":[[0,"An intermediate behavior is usually observed in real systems with ϒi(k) ∝ kα and the exponent close to 1/2."]],"w":19},{"k":"3c68c803","o":146,"s":"엣지 가중치의 국소 이질성 (Local Heterogeneity of Edges' Weight)","en":"In this case, the weights associated with a node are then peaked on a small number of links with the remaining connections carrying just a small fraction of the node's strength.","ko":"이 경우, 노드에 결부된 가중치는 소수의 링크에 집중되며 나머지 연결은 노드 강도의 작은 비율만을 담당한다.","c":[[0,"In this case"],[0,"the weights associated with a node are then peaked on a small number of links with the remaining connections carrying just a small fraction of the node's strength."]],"w":31},{"k":"7b888494","o":147,"s":"엣지 가중치의 국소 이질성 (Local Heterogeneity of Edges' Weight)","en":"This is the situation where our filter will be more useful, highlighting structures impossible to detect using the global threshold filter.","ko":"이것이 우리의 필터가 더 유용한 상황으로, 전역 임계값 필터로는 검출이 불가능한 구조를 부각시킨다.","c":[[0,"This is the situation"],[2,"where our filter will be more useful"],[2,"highlighting structures impossible to detect using the global threshold filter."]],"w":21},{"k":"6702b4f0","o":148,"s":"엣지 가중치의 국소 이질성 (Local Heterogeneity of Edges' Weight)","en":"In this way, the disparity function can be used as a preliminary indicator of the presence of local heterogeneities.","ko":"이렇게 하여 격차 함수는 국소 이질성의 존재에 대한 예비 지표로 사용될 수 있다.","c":[[0,"In this way, the disparity function can be used as a preliminary indicator of the presence of local heterogeneities."]],"w":19},{"k":"19679b67","o":149,"s":"귀무 모형 (The Null Model)","en":"The probability density function of Eq. 1, along with the joint probability distribution for two intervals given by","ko":"식 1의 확률 밀도 함수는, 다음으로 주어지는 두 구간에 대한 결합 확률 분포와 함께,","c":[[0,"The probability density function of Eq. 1, along with the joint probability distribution for two intervals given by"]],"w":18},{"k":"50d29c2c","o":150,"s":"귀무 모형 (The Null Model)","en":"where Θ(·) is the Heaviside step function, can be used to calculate the statistics of ϒnull(k) for the null model.","ko":"여기서 Θ(·)는 헤비사이드 계단 함수(Heaviside step function)이며, 귀무 모형에 대한 ϒnull(k)의 통계량을 계산하는 데 사용될 수 있다.","c":[[1,"where Θ(·) is the Heaviside step function, can be used to calculate the statistics of ϒnull(k) for the null model."]],"w":20},{"k":"56f7dcdc","o":151,"s":"귀무 모형 (The Null Model)","en":"The average µ(ϒnull(k)) = kµ(Ynull(k)) and the variance σ²(ϒnull(k)) = k²σ²(Ynull(k)) are found to be:","ko":"평균 μ(ϒnull(k)) = kμ(Ynull(k))와 분산 σ²(ϒnull(k)) = k²σ²(Ynull(k))는 다음과 같이 구해진다.","c":[[0,"The average µ(ϒnull(k)) = kµ(Ynull(k)) and the variance σ²(ϒnull(k)) = k²σ²(Ynull(k)) are found to be:"]],"w":15},{"k":"254fc49b","o":152,"s":"귀무 모형 (The Null Model)","en":"Notice that the two moments depend on the degree k so that each node in the network with a certain degree k should be compared with the corresponding null model.","ko":"두 적률(moment)이 차수 k에 의존하므로, 특정 차수 k를 지닌 네트워크의 각 노드는 그에 대응하는 귀무 모형과 비교되어야 함에 유의하라.","c":[[0,"Notice"],[2,"that the two moments depend on the degree k"],[3,"so that each node in the network with a certain degree k should be compared with the corresponding null model."]],"w":30},{"k":"6cc32e58","o":153,"s":"귀무 모형 (The Null Model)","en":"The observed values ϒob(k) compatible with the null hypothesis could be defined as those in the region between ϒnull(k) + a · σ(ϒnull(k)) and perfect homogeneity, so that local heterogeneity will be recognized only if the observed values lie outside this area,","ko":"귀무 가설과 양립하는 관측값 ϒob(k)는 ϒnull(k) + a · σ(ϒnull(k))와 완전한 균질성 사이의 영역에 있는 값으로 정의될 수 있으며, 그리하여 관측값이 이 영역 바깥에 놓일 때에만 국소 이질성이 인식된다.","c":[[0,"The observed values ϒob(k)"],[1,"compatible with the null hypothesis"],[0,"could be defined as those in the region"],[1,"between ϒnull(k) + a · σ(ϒnull(k)) and perfect homogeneity,"],[1,"so that local heterogeneity will be recognized"],[2,"only if the observed values lie outside this area,"]],"w":42,"skel":"The observed values … could be defined as those in the region between A and B","fx":1},{"k":"78fbd39b","o":154,"s":"귀무 모형 (The Null Model)","en":"The variable a is a constant determining the confidence interval for the evaluation of the null hypothesis.","ko":"변수 a는 귀무 가설의 평가를 위한 신뢰 구간을 결정하는 상수이다.","c":[[0,"The variable a is a constant determining the confidence interval for the evaluation of the null hypothesis."]],"w":17},{"k":"21338398","o":155,"s":"귀무 모형 (The Null Model)","en":"The larger it is the more restrictive becomes the null model and the more disordered weights should be for local heterogeneity to be detected.","ko":"그 값이 클수록 귀무 모형은 더 제한적이 되며 국소 이질성이 검출되려면 가중치가 더욱 무질서해야 한다.","c":[[0,"The larger it is the more restrictive becomes the null model and the more disordered weights should be for local heterogeneity to be detected."]],"w":24},{"k":"d5391f8e","o":156,"s":"귀무 모형 (The Null Model)","en":"A typical value in analogy to gaussian statistics could be for instance a = 2.","ko":"가우스 통계와의 유비로 볼 때 전형적인 값은 예컨대 a = 2일 수 있다.","c":[[0,"A typical value in analogy to gaussian statistics could be for instance a = 2."]],"w":15},{"k":"ec08e498","o":157,"s":"귀무 모형 (The Null Model)","en":"As shown in Fig. 5, the overall distributions of weights for both networks considered here are very broad, with tails approaching power-law behaviors spanning six decades for the U.S. airport network and more than four for the Florida Bay food web.","ko":"그림 5에 나타난 바와 같이, 여기서 고려된 두 네트워크의 전체 가중치 분포는 매우 넓으며, 그 꼬리는 미국 공항 네트워크의 경우 6개 자릿수에 걸쳐, 플로리다 만 먹이망의 경우 4개 자릿수 이상에 걸쳐 거듭제곱 법칙 거동에 근접한다.","c":[[0,"As shown in Fig. 5, the overall distributions of weights for both networks considered here are very broad,"],[1,"with tails approaching power-law behaviors"],[2,"spanning six decades for the U.S. airport network"],[2,"and more than four for the Florida Bay food web."]],"w":41,"skel":"the overall distributions of weights … are very broad","fx":1},{"k":"0f0ac412","o":158,"s":"귀무 모형 (The Null Model)","en":"At the local level, ϒ(k) measurements cannot be explained by the null model for most nodes.","ko":"국소 수준에서, 대부분의 노드에 대해 ϒ(k) 측정값은 귀무 모형으로 설명될 수 없다.","c":[[0,"At the local level, ϒ(k) measurements cannot be explained by the null model for most nodes."]],"w":16},{"k":"c4b14cbc","o":159,"s":"감사의 글 (Acknowledgments)","en":"This work was supported by Directorate of General Higher Education (DGES) Grant FIS2007-66485-C02-01 (to M.A.S.), DGES Grant FIS2007-66485-C02-02 (to M.B.). A.V. is partially supported by National Science Foundation Award IIS-0513650 and National Institutes of Health Grant R21-DA024259.","ko":"이 연구는 고등교육총국(DGES) 지원금 FIS2007-66485-C02-01(M.A.S.에게)과 DGES 지원금 FIS2007-66485-C02-02(M.B.에게)의 지원을 받았다. A.V.는 미국 국립과학재단(National Science Foundation) 상 IIS-0513650과 미국 국립보건원(National Institutes of Health) 지원금 R21-DA024259의 부분적 지원을 받았다.","c":[[0,"This work was supported by Directorate of General Higher Education (DGES) Grant FIS2007-66485-C02-01 (to M.A.S.)"],[1,"DGES Grant FIS2007-66485-C02-02 (to M.B.). A.V. is partially supported by National Science Foundation Award IIS-0513650 and National Institutes of Health Grant R21-DA024259."]],"w":37}];
(function(){
  "use strict";
  var $=function(s){return document.querySelector(s)};
  var LS=window.localStorage;
  var SIZE=12;                                  // 한 세션 문장 수
  var app=$('#app');

  /* ── 저장 */
  function load(k,d){ try{ return JSON.parse(LS.getItem('jcstudy.'+k)) || d; }catch(e){ return d; } }
  function save(k,v){ try{ LS.setItem('jcstudy.'+k, JSON.stringify(v)); }catch(e){} }
  var ST=load('state',{});      // key → {box, due, seen, wrong}
  var SN=load('session',0);     // 지금까지 끝낸 세션 수

  var BY={}; DATA.forEach(function(p){ BY[p.k]=p; });

  function readCount(){ return Object.keys(ST).length; }

  /* ── 세션 구성: 복습 대상 먼저, 모자라면 새 문장으로 */
  function buildQueue(){
    var due=DATA.filter(function(p){ var s=ST[p.k]; return s && s.due<=SN; });
    var fresh=DATA.filter(function(p){ return !ST[p.k]; });
    return due.slice(0,SIZE).concat(fresh.slice(0,Math.max(0,SIZE-due.length)));
  }

  var Q=[], idx=0, revealed=false, t0=0, log=[];

  /* ── 화면: 시작 */
  function screenStart(){
    Q=buildQueue();
    var due=Q.filter(function(p){ return ST[p.k]; }).length;
    var done=readCount(), pct=Math.round(done/DATA.length*100);
    $('#where').textContent='세션 '+(SN+1);
    $('#bar').style.width='0%';
    if(!Q.length){ app.innerHTML='<div class="screen"><h2>오늘 할 문장이 없습니다</h2>'
      +'<p>복습 차례가 된 문장이 아직 없고, 새 문장도 다 봤습니다.<br>'
      +'논문 '+DATA.length+'문장을 모두 한 번씩 읽었습니다.</p>'
      +'<button class="go ghost" id="force">그래도 복습하기</button></div>';
      $('#force').onclick=function(){ Q=DATA.slice(0,SIZE); start(); }; return; }
    app.innerHTML='<div class="screen">'
      +'<div class="big">'+Q.length+'</div>'
      +'<p style="margin-top:6px">문장 · 복습 '+due+' + 새 문장 '+(Q.length-due)+'</p>'
      +'<div class="stats"><div class="stat"><b>'+done+'</b><span>읽은 문장</span></div>'
      +'<div class="stat"><b>'+DATA.length+'</b><span>전체</span></div>'
      +'<div class="stat"><b>'+pct+'%</b><span>진행</span></div></div>'
      +'<button class="go" id="startbtn">시작 (Space)</button></div>';
    $('#startbtn').onclick=start;
  }

  function start(){ idx=0; log=[]; t0=Date.now();
    DATA.forEach(function(p){ delete p.__requeued; });   // 세션마다 재출제 기회를 새로
    screenCard(); }

  /* ── 화면: 문장 카드 */
  function screenCard(){
    if(idx>=Q.length){ return screenEnd(); }
    var p=Q[idx]; revealed=false;
    $('#where').textContent=p.s.replace(/\s*\(.*\)$/,'')+' · '+(idx+1)+'/'+Q.length;
    $('#bar').style.width=(idx/Q.length*100)+'%';
    var st=ST[p.k];
    var tag = st ? (st.box===0?'다시':'복습') : '처음';
    app.innerHTML='<div class="card">'
      +'<div class="meta"><span class="tag">'+tag+'</span><span>'+p.w+'단어</span></div>'
      +'<div class="sent">'+esc(p.en)+'</div>'
      +'<div class="aids"><button id="clbtn" aria-pressed="false">구조 보기'
      +(p.fx?' <span style="opacity:.7">✎</span>':'')+'</button></div>'
      +'<div class="panel" id="clpanel">'
      +(p.skel?'<h4>뼈대</h4><div class="skel">'+esc(p.skel)+'</div>':'')
      +'<h4'+(p.skel?' style="margin-top:16px"':'')+'>절 분해</h4>'+clauseHTML(p)
      +(p.fx?'':'<div class="auto">자동 분해입니다. 주절로 돌아오는 지점이 어긋날 수 있습니다.</div>')
      +'</div>'
      +'<div id="revealbar"><button id="revealbtn">뜻 확인 <span style="opacity:.6">(Space)</span></button></div>'
      +'<div id="ko">'+esc(p.ko)+'</div>'
      +'<div id="grade">'
      +'<button data-g="1">알았음<small>다음에 또 봐도 됨</small></button>'
      +'<button data-g="2">애매<small>3세션 뒤 다시</small></button>'
      +'<button data-g="3">못 읽음<small>이번 세션 끝에 다시</small></button>'
      +'</div></div>';
    $('#clbtn').onclick=toggleClauses;
    $('#revealbtn').onclick=reveal;
    Array.prototype.forEach.call(document.querySelectorAll('#grade button'),function(b){
      b.onclick=function(){ grade(+b.dataset.g); };
    });
  }

  function clauseHTML(p){
    return p.c.map(function(c){
      return '<div class="cl" style="padding-left:'+(c[0]*1.5)+'em">'
           + (c[0]===0?'<b>'+esc(c[1])+'</b>':esc(c[1]))+'</div>';
    }).join('');
  }
  function toggleClauses(){
    var on=$('#clpanel').classList.toggle('on');
    $('#clbtn').setAttribute('aria-pressed',on?'true':'false');
  }
  function reveal(){
    if(revealed) return;
    revealed=true;
    $('#ko').classList.add('on');
    $('#grade').classList.add('on');
    $('#revealbar').style.display='none';
  }
  function grade(g){
    if(!revealed) return;
    var p=Q[idx], st=ST[p.k]||{box:0,due:0,seen:0,wrong:0};
    st.seen++;
    if(g===1){ st.box=2; st.due=SN+10; }
    else if(g===2){ st.box=1; st.due=SN+3; }
    else { st.box=0; st.due=SN; st.wrong++; }
    ST[p.k]=st; save('state',ST);
    log.push({k:p.k,g:g});
    if(g===3 && Q.indexOf(p)===idx && !p.__requeued){ p.__requeued=true; Q.push(p); }
    idx++; screenCard();
  }

  /* ── 화면: 세션 끝 */
  function screenEnd(){
    SN++; save('session',SN);
    var mins=Math.max(1,Math.round((Date.now()-t0)/60000));
    var ok=log.filter(function(x){return x.g===1;}).length;
    var mid=log.filter(function(x){return x.g===2;}).length;
    var no=log.filter(function(x){return x.g===3;}).length;
    var missed={}; log.forEach(function(x){ if(x.g===3) missed[x.k]=1; });
    var done=readCount(), pct=Math.round(done/DATA.length*100);
    var ml=Object.keys(missed).map(function(k){
      return '<div>'+esc(BY[k].en.slice(0,150))+(BY[k].en.length>150?'…':'')+'</div>'; }).join('');
    $('#bar').style.width='100%';
    $('#where').textContent='세션 '+SN+' 완료';
    app.innerHTML='<div class="screen"><h2>세션 '+SN+' 완료</h2>'
      +'<p>'+log.length+'문장 · '+mins+'분</p>'
      +'<div class="stats">'
      +'<div class="stat"><b style="color:var(--ok)">'+ok+'</b><span>알았음</span></div>'
      +'<div class="stat"><b style="color:var(--mid)">'+mid+'</b><span>애매</span></div>'
      +'<div class="stat"><b style="color:var(--no)">'+no+'</b><span>못 읽음</span></div>'
      +'</div>'
      +'<p>논문 <b>'+done+'/'+DATA.length+'</b>문장 읽음 · '+pct+'%</p>'
      +(ml?'<div class="misslist"><div style="font-size:.7rem;color:var(--muted);border:0;padding-bottom:4px">다시 볼 문장</div>'+ml+'</div>':'')
      +'<div style="margin-top:28px"><button class="go" id="next">다음 세션 (Space)</button></div></div>';
    $('#next').onclick=screenStart;
  }

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* ── 테마 · 초기화 */
  function setTheme(t){ document.documentElement.dataset.theme=t; save('theme',t); }
  setTheme(load('theme', matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  $('#themebtn').onclick=function(){ setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'); };
  $('#resetbtn').onclick=function(){
    if(!confirm('지금까지의 진도와 복습 기록을 모두 지웁니다. 계속할까요?')) return;
    ST={}; SN=0; save('state',ST); save('session',SN); screenStart();
  };

  /* ── 단축키 (한글 입력 상태에서도 되도록 e.code 기준) */
  addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea') return;
    var code=e.code||'';
    var C=/^Key[A-Z]$/.test(code)?code.slice(3).toLowerCase()
         :/^Digit[0-9]$/.test(code)?code.slice(5):(e.key||'').toLowerCase();
    if(code==='Space'||e.key===' '){
      e.preventDefault();
      if($('#startbtn')) return $('#startbtn').click();
      if($('#next')) return $('#next').click();
      if($('#force')) return $('#force').click();
      if(!revealed) reveal();
      return;
    }
    if(revealed && (C==='1'||C==='2'||C==='3')) grade(+C);
    else if(C==='s' && $('#clbtn')) toggleClauses();
  });

  screenStart();
})();
</script>
</body>
</html>
