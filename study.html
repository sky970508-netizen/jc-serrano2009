<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어로 논문 읽기 — Serrano et al. (2009)</title>
<style>
:root{
  --bg:#fbfaf8; --panel:#fff; --ink:#1f2328; --ink-2:#4a5159; --muted:#8a9099;
  --line:#e6e3dd; --accent:#b4552d; --soft:#fdf2ec; --ok:#2f7d5d; --mid:#b8862b; --no:#b4402d;
  --shadow:0 1px 2px rgba(30,25,20,.06),0 10px 30px rgba(30,25,20,.06);
  --serif:"Iowan Old Style","Charter",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
html[data-theme="dark"]{
  --bg:#14161a; --panel:#1b1e24; --ink:#e6e6e4; --ink-2:#b9bec6; --muted:#7d848e;
  --line:#2b2f37; --accent:#e08a5f; --soft:#2a2019; --ok:#5fbf92; --mid:#d6a94a; --no:#e0715a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-text-size-adjust:100%;overflow-x:hidden}
button{font-family:var(--sans)}

#top{position:fixed;top:0;left:0;right:0;height:52px;z-index:10;display:flex;align-items:center;
  gap:12px;padding:0 16px;background:color-mix(in srgb,var(--panel) 90%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#top .where{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .sp{flex:1}
#top a,#top button.ic{border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
  border-radius:8px;padding:5px 10px;font-size:.75rem;text-decoration:none;cursor:pointer;white-space:nowrap}
#top a:hover,#top button.ic:hover{border-color:var(--accent);color:var(--accent)}
#bar{position:fixed;top:52px;left:0;height:3px;background:var(--accent);z-index:11;width:0;transition:width .25s}

main{max-width:760px;margin:0 auto;padding:96px 20px 140px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:34px 32px;box-shadow:var(--shadow)}
.sent{font-family:var(--serif);font-size:1.42rem;line-height:1.62;color:var(--ink);
  letter-spacing:-.005em}
.meta{display:flex;gap:10px;align-items:center;margin-bottom:18px;font-size:.72rem;color:var(--muted)}
.meta .tag{background:var(--soft);color:var(--accent);border-radius:999px;padding:3px 9px;font-weight:600}

.aids{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.aids button{border:1px solid var(--line);background:var(--bg);color:var(--ink-2);border-radius:9px;
  padding:7px 13px;font-size:.78rem;cursor:pointer}
.aids button:hover{border-color:var(--accent);color:var(--accent)}
.aids button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.panel{margin-top:16px;padding:16px 18px;background:var(--bg);border:1px solid var(--line);
  border-radius:12px;display:none}
.panel.on{display:block}
.panel h4{margin:0 0 10px;font-size:.68rem;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
.cl{font-family:var(--serif);font-size:.98rem;line-height:1.62;color:var(--ink-2);margin:3px 0}
.cl b{color:var(--ink);font-weight:600}
.auto{margin-top:10px;font-size:.7rem;color:var(--muted)}
.skel{font-family:var(--serif);font-size:1.02rem;line-height:1.6;color:var(--ink);
  background:var(--soft);border-radius:8px;padding:10px 13px}

#revealbar{margin-top:26px;text-align:center}
#revealbtn{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:12px;
  padding:14px 22px;font-size:.85rem;cursor:pointer;width:100%}
#revealbtn:hover{border-color:var(--accent);color:var(--accent)}

#ko{display:none;margin-top:24px;padding-top:22px;border-top:1px solid var(--line);
  font-size:1.02rem;line-height:1.85;color:var(--ink-2)}
#ko.on{display:block}

#grade{display:none;gap:10px;margin-top:26px}
#grade.on{display:flex}
#grade button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:12px;
  padding:14px 8px;cursor:pointer;font-size:.86rem;font-weight:600;color:var(--ink)}
#grade button small{display:block;font-weight:400;font-size:.66rem;color:var(--muted);margin-top:3px}
#grade button[data-g="1"]:hover{border-color:var(--ok);color:var(--ok)}
#grade button[data-g="2"]:hover{border-color:var(--mid);color:var(--mid)}
#grade button[data-g="3"]:hover{border-color:var(--no);color:var(--no)}

.screen{text-align:center;padding:40px 10px}
.screen h2{font-size:1.3rem;margin:0 0 8px}
.screen p{color:var(--ink-2);font-size:.9rem;line-height:1.8;margin:0 0 22px}
.big{font-family:var(--serif);font-size:2.6rem;color:var(--accent);line-height:1.1}
.go{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:14px 30px;
  font-size:.92rem;font-weight:600;cursor:pointer}
.go.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.stats{display:flex;justify-content:center;gap:26px;margin:24px 0}
.stat b{display:block;font-family:var(--serif);font-size:1.9rem;color:var(--ink)}
.stat span{font-size:.7rem;color:var(--muted)}
.misslist{text-align:left;max-width:560px;margin:18px auto 0}
.misslist div{font-family:var(--serif);font-size:.86rem;line-height:1.55;color:var(--ink-2);
  padding:9px 0;border-top:1px solid var(--line)}

#foot{position:fixed;left:0;right:0;bottom:0;padding:10px 16px;text-align:center;
  font-size:.68rem;color:var(--muted);background:linear-gradient(transparent,var(--bg) 40%)}
kbd{background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
  padding:1px 5px;font-family:ui-monospace,Menlo,monospace;font-size:.9em;color:var(--ink-2)}

@media(max-width:700px){
  main{padding:80px 14px 120px}
  .card{padding:24px 18px;border-radius:14px}
  .sent{font-size:1.18rem}
  #top .where{font-size:.72rem}
  .stats{gap:16px}
  #foot{display:none}
}
</style>
</head>
<body>

<div id="top">
  <div class="where" id="where">불러오는 중…</div>
  <div class="sp"></div>
  <button class="ic" id="themebtn" title="테마">◐</button>
  <button class="ic" id="resetbtn" title="진도 초기화">초기화</button>
  <a href="index.html">논문 페이지 →</a>
</div>
<div id="bar"></div>

<main id="app"></main>
<div id="foot"><kbd>Space</kbd> 뜻 확인 · <kbd>1</kbd> 알았음 <kbd>2</kbd> 애매 <kbd>3</kbd> 못 읽음 · <kbd>S</kbd> 구조</div>

<script>
var DATA = [{"k":"1e1c5fc5","o":1,"s":"초록 (Abstract)","en":"A large number of complex systems find a natural abstraction in the form of weighted networks whose nodes represent the elements of the system and the weighted edges identify the presence of an interaction and its relative strength.","ko":"수많은 복잡계는 노드(node)가 시스템의 구성 요소를 나타내고 가중 엣지(weighted edge)이 상호작용의 존재와 그 상대적 세기를 식별하는, 가중 네트워크(weighted network)의 형태로 자연스럽게 추상화된다.","c":[[0,"A large number of complex systems find a natural abstraction in the form of weighted networks"],[2,"whose nodes represent the elements of the system and the weighted edges identify the presence of an interaction and its relative strength."]],"w":38},{"k":"61d74962","o":2,"s":"초록 (Abstract)","en":"In recent years, the study of an increasing number of large-scale networks has highlighted the statistical heterogeneity of their interaction pattern, with degree and weight distributions that vary over many orders of magnitude.","ko":"최근 몇 년간 점점 더 많은 대규모 네트워크에 대한 연구는, 여러 자릿수(order of magnitude)에 걸쳐 변화하는 차수(degree) 및 가중치(weight) 분포와 함께 그 상호작용 패턴의 통계적 이질성(statistical heterogeneity)을 부각시켜 왔다.","c":[[0,"In recent years"],[0,"the study of an increasing number of large-scale networks has highlighted the statistical heterogeneity of their interaction pattern"],[1,"with degree and weight distributions"],[2,"that vary over many orders of magnitude."]],"w":33},{"k":"e1dc0801","o":3,"s":"초록 (Abstract)","en":"These features, along with the large number of elements and links, make the extraction of the truly relevant connections forming the network's backbone a very challenging problem.","ko":"이러한 특성은 다수의 구성 요소 및 링크(link)와 더불어, 네트워크의 백본(backbone)을 형성하는 진정으로 유의미한 연결의 추출을 매우 어려운 문제로 만든다.","c":[[0,"These features"],[1,"along with the large number of elements and links"],[1,"make the extraction of the truly relevant connections forming the network's backbone a very challenging problem."]],"w":27},{"k":"3e972683","o":4,"s":"초록 (Abstract)","en":"More specifically, coarse-graining approaches and filtering techniques come into conflict with the multiscale nature of large-scale systems.","ko":"보다 구체적으로, 조대화(coarse-graining) 접근법과 필터링(filtering) 기법은 대규모 시스템의 다중스케일(multiscale) 특성과 충돌한다.","c":[[0,"More specifically, coarse-graining approaches and filtering techniques come into conflict with the multiscale nature of large-scale systems."]],"w":17},{"k":"61f224d6","o":5,"s":"초록 (Abstract)","en":"Here, we define a filtering method that offers a practical procedure to extract the relevant connection backbone in complex multiscale networks, preserving the edges that represent statistically significant deviations with respect to a null model for the local assignment of weights to edges.","ko":"여기서 우리는 엣지에 대한 가중치의 국소적 배정에 관한 귀무 모형(null model)에 대해 통계적으로 유의한 편차를 나타내는 엣지를 보존함으로써, 복잡한 다중스케일 네트워크에서 유의미한 연결 백본을 추출하는 실용적 절차를 제공하는 필터링 방법을 정의한다.","c":[[0,"Here, we define a filtering method"],[1,"that offers a practical procedure to extract the relevant connection backbone in complex multiscale networks,"],[1,"preserving the edges"],[2,"that represent statistically significant deviations with respect to a null model"],[3,"for the local assignment of weights to edges."]],"w":43,"skel":"we define a filtering method that offers a procedure …, preserving the edges","fx":1},{"k":"7220a8c2","o":6,"s":"초록 (Abstract)","en":"An important aspect of the method is that it does not belittle small-scale interactions and operates at all scales defined by the weight distribution.","ko":"이 방법의 중요한 측면은 소규모 상호작용을 경시하지 않으며 가중치 분포에 의해 정의되는 모든 스케일에서 작동한다는 점이다.","c":[[0,"An important aspect of the method is"],[2,"that it does not belittle small-scale interactions and operates at all scales defined by the weight distribution."]],"w":24},{"k":"c6bdf2c4","o":7,"s":"초록 (Abstract)","en":"We apply our method to real-world network instances and compare the obtained results with alternative backbone extraction techniques.","ko":"우리는 이 방법을 실제 네트워크 사례에 적용하고 얻어진 결과를 대안적인 백본 추출 기법들과 비교한다.","c":[[0,"We apply our method to real-world network instances and compare the obtained results with alternative backbone extraction techniques."]],"w":18},{"k":"4b9e98f7","o":8,"s":"서론 (Introduction)","en":"In recent years, a huge amount of data on large-scale social, biological, and communication networks, meticulously collected and catalogued, has become available for scientific analysis and study.","ko":"최근 몇 년간, 세심하게 수집되고 목록화된 대규모 사회적·생물학적·통신 네트워크에 관한 방대한 양의 데이터가 과학적 분석과 연구에 활용 가능해졌다.","c":[[0,"In recent years"],[1,"a huge amount of data on large-scale social, biological"],[1,"and communication networks"],[1,"meticulously collected and catalogued"],[1,"has become available for scientific analysis and study."]],"w":27},{"k":"19f2a5e0","o":9,"s":"서론 (Introduction)","en":"Examples can be found in all domains; from technological to social systems and transportation networks on a local and global scale, and down to the microscopic scale of biochemical networks (1–3).","ko":"그 예는 모든 영역에서 찾아볼 수 있는데, 국소적·전역적 규모의 기술적·사회적 시스템과 교통 네트워크에서부터 생화학 네트워크의 미시적 규모에 이르기까지 다양하다 (1–3).","c":[[0,"Examples can be found in all domains"],[1,"from technological to social systems and transportation networks on a local and global scale"],[1,"and down to the microscopic scale of biochemical networks (1–3)."]],"w":31},{"k":"991d9499","o":10,"s":"서론 (Introduction)","en":"Common traits of these networks can be found in the statistical properties characterized by large-scale heterogeneity with statistical observables such as nodes' degree and traffic varying over a wide range of scales (4).","ko":"이러한 네트워크의 공통적 특징은 노드의 차수와 트래픽(traffic) 같은 통계적 관측량이 넓은 범위의 스케일에 걸쳐 변화하는 대규모 이질성으로 특징지어지는 통계적 성질에서 찾을 수 있다 (4).","c":[[0,"Common traits of these networks can be found in the statistical properties characterized by large-scale heterogeneity with statistical observables such as nodes' degree and traffic varying over a wide range of scales (4)."]],"w":33},{"k":"3e007c47","o":11,"s":"서론 (Introduction)","en":"The sheer size and multiscale nature of these networks make very difficult the extraction of the relevant information that would allow a reduced representation while preserving the key features we want to highlight.","ko":"이러한 네트워크의 방대한 규모와 다중스케일 특성은, 우리가 부각시키고자 하는 핵심 특징을 보존하면서 축소된 표현을 가능하게 할 유의미한 정보의 추출을 매우 어렵게 만든다.","c":[[0,"The sheer size and multiscale nature of these networks make very difficult the extraction of the relevant information"],[2,"that would allow a reduced representation"],[3,"while preserving the key features we want to highlight."]],"w":33},{"k":"f35b199f","o":12,"s":"서론 (Introduction)","en":"A typical example is seen in the visualization of networks.","ko":"전형적인 예는 네트워크의 시각화(visualization)에서 볼 수 있다.","c":[[0,"A typical example is seen in the visualization of networks."]],"w":10},{"k":"8895525d","o":13,"s":"서론 (Introduction)","en":"Although, in general, it is possible to create wonderful images of large-scale heterogeneous networks, the amount of valuable information gathered is in most cases very little because of the redundant intricacy generated by the overwhelming number of connections.","ko":"일반적으로 대규모 이질적 네트워크의 훌륭한 이미지를 만드는 것은 가능하지만, 압도적인 수의 연결이 만들어 내는 불필요한 복잡성 때문에 얻어지는 유의미한 정보의 양은 대부분의 경우 매우 적다.","c":[[1,"Although, in general"],[0,"it is possible to create wonderful images of large-scale heterogeneous networks"],[0,"the amount of valuable information gathered is in most cases very little"],[1,"because of the redundant intricacy generated by the overwhelming number of connections."]],"w":38},{"k":"b3617c86","o":14,"s":"서론 (Introduction)","en":"Problems such as the extraction of the relevant backbone or the isolation of the statistically relevant structures/signal that would allow reduced but meaningful representations of the system are indeed major challenges in the analysis of large-scale networks.","ko":"유의미한 백본의 추출이나, 시스템의 축소되었지만 의미 있는 표현을 가능하게 할 통계적으로 유의미한 구조/신호의 분리와 같은 문제들은 실제로 대규모 네트워크 분석의 주요 난제이다.","c":[[0,"Problems such as the extraction of the relevant backbone or the isolation of the statistically relevant structures/signal"],[2,"that would allow reduced but meaningful representations of the system are indeed major challenges in the analysis of large-scale networks."]],"w":37},{"k":"53dc0a26","o":15,"s":"서론 (Introduction)","en":"In complex weighted networks, the discrimination of the right trade-off between the level of network reduction and the amount of relevant information preserved in the new representation faces us with additional problems.","ko":"복잡 가중 네트워크에서, 네트워크 축소의 수준과 새로운 표현에 보존되는 유의미한 정보의 양 사이의 올바른 절충(trade-off)을 판별하는 일은 우리에게 추가적인 문제를 제기한다.","c":[[0,"In complex weighted networks"],[1,"the discrimination of the right trade-off between the level of network reduction and the amount of relevant information preserved in the new representation faces us with additional problems."]],"w":32},{"k":"0d8f5d47","o":16,"s":"서론 (Introduction)","en":"In many cases, the probability distribution P(ω) that any given link is carrying a weight ω is broadly distributed, spanning several orders of magnitude.","ko":"많은 경우, 임의의 링크가 가중치 ω를 가질 확률 분포 P(ω)는 여러 자릿수에 걸쳐 넓게 분포한다.","c":[[0,"In many cases, the probability distribution P(ω)"],[2,"that any given link is carrying a weight ω is broadly distributed"],[2,"spanning several orders of magnitude."]],"w":24},{"k":"7b062dca","o":17,"s":"서론 (Introduction)","en":"This feature implies the lack of a characteristic scale and any method based on thresholding would simply overlook the information present above or below the arbitrary cutoff scale.","ko":"이 특성은 특성 스케일(characteristic scale)의 부재를 함의하며, 임계화(thresholding)에 기반한 어떤 방법도 임의의 절단(cutoff) 스케일 위나 아래에 존재하는 정보를 단순히 간과하게 된다.","c":[[0,"This feature implies the lack of a characteristic scale and any method based on thresholding would simply overlook the information present above or below the arbitrary cutoff scale."]],"w":28},{"k":"e4e571ea","o":18,"s":"서론 (Introduction)","en":"Although this issue would not be a major drawback in networks where the intensities of all the edges are independently and identically distributed, the cutoff of the P(ω) tail would destroy the multiscale nature of more realistic networks where weights are locally correlated on edges incident to the same node and nontrivially coupled to topology (5).","ko":"이 문제는 모든 엣지의 세기가 독립 항등 분포를 따르는 네트워크에서는 큰 결점이 아니겠지만, P(ω) 꼬리(tail)의 절단은 가중치가 동일 노드에 접한 엣지들에서 국소적으로 상관되고 위상(topology)과 자명하지 않게 결합된, 보다 현실적인 네트워크의 다중스케일 특성을 파괴할 것이다 (5).","c":[[1,"Although this issue would not be a major drawback in networks"],[2,"where the intensities of all the edges are independently and identically distributed,"],[0,"the cutoff of the P(ω) tail would destroy the multiscale nature of more realistic networks"],[1,"where weights are locally correlated on edges incident to the same node and nontrivially coupled to topology (5)."]],"w":56,"skel":"the cutoff of the P(ω) tail would destroy the multiscale nature of more realistic networks","fx":1},{"k":"81e5ea05","o":19,"s":"서론 (Introduction)","en":"Thus, the presence of multiscale fluctuations calls for reduction techniques that consistently highlight the relevant structures and hierarchies without favoring any particular resolution scale.","ko":"따라서 다중스케일 요동(fluctuation)의 존재는 특정 해상도 스케일을 편애하지 않으면서 유의미한 구조와 계층을 일관되게 부각시키는 축소 기법을 요구한다.","c":[[0,"Thus, the presence of multiscale fluctuations calls for reduction techniques"],[2,"that consistently highlight the relevant structures and hierarchies without favoring any particular resolution scale."]],"w":24},{"k":"b6273774","o":20,"s":"서론 (Introduction)","en":"Furthermore, it also demands a change in the focus toward a local perspective rather than a global one, where the relevance of the connections could be decided at the level of nodes in relative terms.","ko":"나아가 이는 또한 전역적 관점보다 국소적 관점으로의 초점 전환을 요구하는데, 이 관점에서는 연결의 유의미성이 노드 수준에서 상대적인 관점으로 결정될 수 있다.","c":[[0,"Furthermore"],[1,"it also demands a change in the focus toward a local perspective rather than a global one"],[2,"where the relevance of the connections could be decided at the level of nodes in relative terms."]],"w":35},{"k":"d1ae3be7","o":21,"s":"서론 (Introduction)","en":"In this work, we concentrate on a particular technique that operates at all the scales defined by the weighted network structure.","ko":"이 연구에서 우리는 가중 네트워크 구조에 의해 정의되는 모든 스케일에서 작동하는 특정 기법에 집중한다.","c":[[0,"In this work, we concentrate on a particular technique"],[2,"that operates at all the scales defined by the weighted network structure."]],"w":21},{"k":"8fb17471","o":22,"s":"서론 (Introduction)","en":"This method, based on the local identification of the statistically relevant weight heterogeneities, is able to filter out the backbone of dominant connections in weighted networks with strong disorder, preserving structural properties and hierarchies at all scales.","ko":"통계적으로 유의미한 가중치 이질성의 국소적 식별에 기반한 이 방법은, 모든 스케일에서 구조적 성질과 계층을 보존하면서 강한 무질서(strong disorder)를 지닌 가중 네트워크에서 지배적 연결의 백본을 걸러 낼 수 있다.","c":[[0,"This method"],[1,"based on the local identification of the statistically relevant weight heterogeneities"],[1,"is able to filter out the backbone of dominant connections in weighted networks with strong disorder"],[1,"preserving structural properties and hierarchies at all scales."]],"w":37},{"k":"eca4a866","o":23,"s":"서론 (Introduction)","en":"We discuss our multiscale filter in relation to the appropriate null model that provides the basis for the statistical significance of the heterogeneity measurements.","ko":"우리는 이질성 측정의 통계적 유의성(statistical significance)의 기반을 제공하는 적절한 귀무 모형과 관련하여 이 다중스케일 필터를 논의한다.","c":[[0,"We discuss our multiscale filter in relation to the appropriate null model"],[2,"that provides the basis for the statistical significance of the heterogeneity measurements."]],"w":24},{"k":"dc8d5eda","o":24,"s":"서론 (Introduction)","en":"We apply the technique to two real-world networks, the U.S. airport network and the Florida Bay food web, and compare the results with those obtained by the application of thresholding methods.","ko":"우리는 이 기법을 두 개의 실제 네트워크, 즉 미국 공항 네트워크와 플로리다 만(Florida Bay) 먹이망(food web)에 적용하고, 그 결과를 임계화 방법의 적용으로 얻어진 결과와 비교한다.","c":[[0,"We apply the technique to two real-world networks"],[1,"the U.S. airport network and the Florida Bay food web"],[1,"and compare the results with those obtained by the application of thresholding methods."]],"w":31},{"k":"3d0a18e1","o":25,"s":"결과 및 논의 (Results and Discussion)","en":"In statistical mathematics, as in other areas, filtering techniques aimed at uncovering the relevant information in datasets are popular and successful.","ko":"다른 분야에서와 마찬가지로 통계 수학에서도, 데이터셋에서 유의미한 정보를 밝혀내는 것을 목표로 하는 필터링 기법은 널리 쓰이며 성공적이다.","c":[[0,"In statistical mathematics, as in other areas"],[1,"filtering techniques aimed at uncovering the relevant information in datasets are popular and successful."]],"w":21},{"k":"254b8415","o":26,"s":"결과 및 논의 (Results and Discussion)","en":"One could cite, for instance, the Principal Components Analysis to identify hidden patterns by reducing the effective dimension of multivariate data (6).","ko":"예를 들어, 다변량 데이터의 유효 차원을 축소하여 숨은 패턴을 식별하는 주성분 분석(Principal Components Analysis)을 들 수 있다 (6).","c":[[0,"One could cite, for instance, the Principal Components Analysis to identify hidden patterns by reducing the effective dimension of multivariate data (6)."]],"w":22},{"k":"a980fb4d","o":27,"s":"결과 및 논의 (Results and Discussion)","en":"In the following, we will refer to the network reduction as the construction of a network that contains far fewer data (in our case, links) and allows the discrimination and computational tractability of the relevant features of the original networks; for instance, the traffic backbone of a large-scale transportation infrastructure.","ko":"이하에서 우리는 네트워크 축소(network reduction)를, 훨씬 적은 데이터(우리의 경우 링크)를 담고 있으면서 원래 네트워크의 유의미한 특징에 대한 판별과 계산적 처리 가능성을 허용하는 네트워크의 구성으로, 예컨대 대규모 교통 기반시설의 트래픽 백본을 구성하는 것으로 지칭할 것이다.","c":[[0,"In the following, we will refer to the network reduction as the construction of a network"],[1,"that contains far fewer data (in our case, links)"],[1,"and allows the discrimination and computational tractability of the relevant features of the original networks;"],[1,"for instance, the traffic backbone of a large-scale transportation infrastructure."]],"w":50,"skel":"we will refer to the network reduction as the construction of a network","fx":1},{"k":"88b6ad75","o":28,"s":"결과 및 논의 (Results and Discussion)","en":"Reduction schemes can be divided into two main categories: coarse-graining and filtering/pruning.","ko":"축소 방식은 두 가지 주요 범주, 즉 조대화와 필터링/가지치기(filtering/pruning)로 나눌 수 있다.","c":[[0,"Reduction schemes can be divided into two main categories: coarse-graining and filtering/pruning."]],"w":12},{"k":"30184520","o":29,"s":"결과 및 논의 (Results and Discussion)","en":"In the first case, nodes sharing a common attribute could be gathered together in the same class—group, community, etc.—and then substituted by a single new unit that represents the whole class in a new network representation of the system (7–10).","ko":"첫 번째 경우, 공통 속성을 공유하는 노드들이 동일한 부류—집단, 커뮤니티 등—로 함께 묶인 뒤, 시스템의 새로운 네트워크 표현에서 그 부류 전체를 나타내는 하나의 새로운 단위로 대체될 수 있다 (7–10).","c":[[0,"In the first case"],[1,"nodes sharing a common attribute could be gathered together in the same class, —group, community, etc."],[1,"—and then substituted by a single new unit"],[2,"that represents the whole class in a new network representation of the system (7–10)."]],"w":40},{"k":"ad9aba64","o":30,"s":"결과 및 논의 (Results and Discussion)","en":"This coarse-graining is indeed zooming out the system so that it can be observed at different scales.","ko":"이 조대화는 실제로 시스템을 다른 스케일에서 관찰할 수 있도록 축소해 보는(zooming out) 것이다.","c":[[0,"This coarse-graining is indeed zooming out the system"],[2,"so that it can be observed at different scales."]],"w":17},{"k":"2b9e0d0a","o":31,"s":"결과 및 논의 (Results and Discussion)","en":"Something completely different is done when a filter is applied.","ko":"필터가 적용될 때에는 완전히 다른 작업이 이루어진다.","c":[[0,"Something completely different is done"],[2,"when a filter is applied."]],"w":10},{"k":"7dbf0a2e","o":32,"s":"결과 및 논의 (Results and Discussion)","en":"In this case, the observation scale is fixed and the representation that the network symbolizes is not changed.","ko":"이 경우, 관측 스케일은 고정되며 네트워크가 상징하는 표현은 바뀌지 않는다.","c":[[0,"In this case, the observation scale is fixed and the representation"],[2,"that the network symbolizes is not changed."]],"w":18},{"k":"488f8d01","o":33,"s":"결과 및 논의 (Results and Discussion)","en":"Instead, those elements, nodes and edges, that carry relevant information about the network structure are kept while the rest are discarded.","ko":"대신, 네트워크 구조에 관한 유의미한 정보를 지닌 요소들, 즉 노드와 엣지는 유지되고 나머지는 폐기된다.","c":[[0,"Instead, those elements, nodes and edges"],[2,"that carry relevant information about the network structure are kept"],[3,"while the rest are discarded."]],"w":21},{"k":"2b768bd0","o":34,"s":"결과 및 논의 (Results and Discussion)","en":"An example of a well-known hierarchical topological filter, although usually not referred to as such, is the k-core decomposition of a network (11), with a filtering rule that acts on the connectivity of the nodes.","ko":"잘 알려진 계층적 위상 필터의 한 예는—보통 그렇게 지칭되지는 않지만—노드의 연결성에 작용하는 필터링 규칙을 지닌 네트워크의 k-코어 분해(k-core decomposition)이다 (11).","c":[[0,"An example of a well-known hierarchical topological filter"],[2,"although usually not referred to as such"],[2,"is the k-core decomposition of a network (11)"],[2,"with a filtering rule"],[3,"that acts on the connectivity of the nodes."]],"w":35},{"k":"fcb73ef4","o":35,"s":"최소 신장 트리 (minimum spanning tree, MST)","en":"In the case of weighted networks (5), two basic reduction techniques refer to the extraction of the minimum spanning tree and the application of a global threshold on the weights of the links so that just those that beat the threshold are preserved.","ko":"가중 네트워크의 경우 (5), 두 가지 기본적인 축소 기법은 최소 신장 트리(minimum spanning tree)의 추출과, 임계값을 넘는 링크만 보존되도록 링크의 가중치에 전역 임계값(global threshold)을 적용하는 것을 가리킨다.","c":[[0,"In the case of weighted networks (5), two basic reduction techniques refer to"],[1,"the extraction of the minimum spanning tree"],[1,"and the application of a global threshold on the weights of the links"],[2,"so that just those that beat the threshold are preserved."]],"w":43,"skel":"two basic reduction techniques refer to A and B","fx":1},{"k":"38788747","o":36,"s":"최소 신장 트리 (minimum spanning tree, MST)","en":"The minimum spanning tree of a graph G, a classical concept of graph theory (12), is the shortest-length tree subgraph that contains all the nodes of G.","ko":"그래프 이론(graph theory)의 고전적 개념인 그래프 mathcalG의 최소 신장 트리는 (12), mathcalG의 모든 노드를 포함하는 최단 길이의 트리 부분그래프이다.","c":[[0,"The minimum spanning tree of a graph G"],[1,"a classical concept of graph theory (12)"],[1,"is the shortest-length tree subgraph"],[2,"that contains all the nodes of G."]],"w":27},{"k":"40a761cb","o":37,"s":"최소 신장 트리 (minimum spanning tree, MST)","en":"These definitions can be generalized for weighted graphs (13).","ko":"이러한 정의는 가중 그래프에 대해 일반화될 수 있다 (13).","c":[[0,"These definitions can be generalized for weighted graphs (13)."]],"w":9},{"k":"5af60e43","o":38,"s":"최소 신장 트리 (minimum spanning tree, MST)","en":"A minimum spanning tree of a weighted graph G is the spanning tree of G whose edges sum to minimum weight.","ko":"가중 그래프 mathcalG의 최소 신장 트리는 엣지의 합이 최소 가중치가 되는 mathcalG의 신장 트리이다.","c":[[0,"A minimum spanning tree of a weighted graph G is the spanning tree of G"],[2,"whose edges sum to minimum weight."]],"w":21},{"k":"ab474e7e","o":39,"s":"최소 신장 트리 (minimum spanning tree, MST)","en":"This idea has been exploited along with percolation criticality to define superhighways in weighted networks (14).","ko":"이 착상은 스미기 임계(percolation criticality)와 함께 활용되어 가중 네트워크에서 초고속도로(superhighway)를 정의하는 데 쓰였다 (14).","c":[[0,"This idea has been exploited along with percolation criticality to define superhighways in weighted networks (14)."]],"w":16},{"k":"4e9f9a3b","o":40,"s":"최소 신장 트리 (minimum spanning tree, MST)","en":"By using opportune transformation rules for the weights, it is also possible to define maximum weighted spanning trees and other analogous definitions.","ko":"가중치에 대한 적절한 변환 규칙을 사용하면, 최대 가중 신장 트리와 그 밖의 유사한 정의를 정의하는 것도 가능하다.","c":[[0,"By using opportune transformation rules for the weights, it is also possible to define maximum weighted spanning trees and other analogous definitions."]],"w":22},{"k":"39cf3cb2","o":41,"s":"최소 신장 트리 (minimum spanning tree, MST)","en":"One of the big limitations of this method is that spanning trees are by construction acyclic.","ko":"이 방법의 큰 한계 중 하나는 신장 트리가 구성상 비순환적(acyclic)이라는 점이다.","c":[[0,"One of the big limitations of this method is"],[2,"that spanning trees are by construction acyclic."]],"w":16},{"k":"00f855b4","o":42,"s":"최소 신장 트리 (minimum spanning tree, MST)","en":"This means that reduced networks obtained by this algorithm are overly structural simplifications that destroy local cycles, clustering coefficient, and the clustering hierarchies often present in real world networks.","ko":"이는 이 알고리즘으로 얻어진 축소 네트워크가, 실제 네트워크에 흔히 존재하는 국소 순환(local cycle), 뭉침 계수(clustering coefficient), 뭉침 계층을 파괴하는 과도한 구조적 단순화임을 의미한다.","c":[[0,"This means"],[2,"that reduced networks obtained by this algorithm are overly structural simplifications"],[3,"that destroy local cycles, clustering coefficient"],[2,"and the clustering hierarchies often present in real world networks."]],"w":29},{"k":"b3a4770c","o":43,"s":"전역임계값(golbal threshold)","en":"These previous drawbacks are not present in the application of a threshold to the global weight distribution that removes all connections with a weight below a given value ωc.","ko":"앞서의 이러한 결점들은, 주어진 값 ωc 미만의 가중치를 지닌 모든 연결을 제거하는 전역 가중치 분포에 대한 임계값 적용에서는 나타나지 않는다.","c":[[0,"These previous drawbacks are not present in the application of a threshold to the global weight distribution"],[2,"that removes all connections with a weight below a given value ωc."]],"w":29},{"k":"15ec8dc8","o":44,"s":"전역임계값(golbal threshold)","en":"This filter has been used, for instance, in the study of functional networks connecting correlated human brain sites (15) and food web resistance as a function of link magnitude (16).","ko":"이 필터는 예컨대 상관된 인간 뇌 부위를 연결하는 기능적 네트워크의 연구 (15)와, 링크 크기의 함수로서의 먹이망 저항성(food web resistance)의 연구 (16)에 사용되어 왔다.","c":[[0,"This filter has been used, for instance"],[1,"in the study of functional networks connecting correlated human brain sites (15) and food web resistance as a function of link magnitude (16)."]],"w":30},{"k":"39ff8b80","o":45,"s":"전역임계값(golbal threshold)","en":"This approach, however, belittles nodes with a small strength s (defined as the sum of weights incident to the node si = Σj wij), since the introduction of ωc induces a characteristic scale from the outset.","ko":"그러나 이 접근법은 ωc의 도입이 처음부터 특성 스케일을 유발하기 때문에, 작은 강도(strength) s(노드에 접한 가중치의 합으로 정의되며 si = Σj wij)를 지닌 노드를 경시한다.","c":[[0,"This approach, however"],[1,"belittles nodes with a small strength s (defined as the sum of weights incident to the node si = Σj wij)"],[2,"since the introduction of ωc induces a characteristic scale from the outset."]],"w":36},{"k":"9026a363","o":46,"s":"전역임계값(golbal threshold)","en":"As a consequence, strongly disordered networks with heavy-tailed statistical distributions P(s) and P(ω) cause this simple thresholding algorithm to be very poorly performing since nodes with small s are systematically overlooked.","ko":"결과적으로, 두꺼운 꼬리(heavy-tailed)의 통계적 분포 P(s)와 P(ω)를 지닌 강한 무질서 네트워크에서는 작은 s를 지닌 노드가 체계적으로 간과되므로 이 단순한 임계화 알고리즘은 매우 저조한 성능을 보인다.","c":[[0,"As a consequence"],[1,"strongly disordered networks with heavy-tailed statistical distributions P(s) and P(ω) cause this simple thresholding algorithm to be very poorly performing"],[2,"since nodes with small s are systematically overlooked."]],"w":31},{"k":"6b10abad","o":47,"s":"전역임계값(golbal threshold)","en":"This is an even more serious drawback when weights are correlated at the local level.","ko":"이는 가중치가 국소 수준에서 상관될 때 더욱 심각한 결점이 된다.","c":[[0,"This is an even more serious drawback"],[2,"when weights are correlated at the local level."]],"w":15},{"k":"49274bd1","o":48,"s":"전역임계값(golbal threshold)","en":"In this type of network, interesting features and structures are present at all scales and the introduction of such an artificial cutoff drastically removes all information below the cutoff scale.","ko":"이러한 유형의 네트워크에서는 흥미로운 특징과 구조가 모든 스케일에 존재하며, 그러한 인위적 절단의 도입은 절단 스케일 아래의 모든 정보를 급격하게 제거한다.","c":[[0,"In this type of network"],[1,"interesting features and structures are present at all scales and the introduction of such an artificial cutoff drastically removes all information below the cutoff scale."]],"w":30},{"k":"240ee87f","o":49,"s":"국소 요동 (Local Fluctuations)","en":"To develop a multiscale reduction algorithm, we take advantage of the local fluctuations of weights on the links emanated by single nodes.","ko":"다중스케일 축소 알고리즘을 개발하기 위해, 우리는 개별 노드에서 뻗어 나온 링크에 대한 가중치의 국소 요동(local fluctuation)을 활용한다.","c":[[0,"To develop a multiscale reduction algorithm, we take advantage of the local fluctuations of weights on the links emanated by single nodes."]],"w":22},{"k":"2dc3683f","o":50,"s":"국소 요동 (Local Fluctuations)","en":"In heterogeneous weighted networks with strong disorder, i.e., heavy-tailed P(ω) and P(s) distributions, a few links carry the largest proportion of the node's total strength.","ko":"강한 무질서를 지닌 이질적 가중 네트워크, 즉 두꺼운 꼬리의 P(ω) 및 P(s) 분포에서는 소수의 링크가 노드 전체 강도의 가장 큰 비중을 담당한다.","c":[[0,"In heterogeneous weighted networks with strong disorder, i.e., heavy-tailed P(ω) and P(s) distributions, a few links carry the largest proportion of the node's total strength."]],"w":25},{"k":"d990ceed","o":51,"s":"국소 요동 (Local Fluctuations)","en":"Furthermore, most real networks have nodes surrounded by incident edges with associated weights that are heterogeneously distributed and correlated between them.","ko":"나아가 대부분의 실제 네트워크는 이질적으로 분포하며 서로 상관된 가중치를 가진 접한 엣지들로 둘러싸인 노드를 지닌다.","c":[[0,"Furthermore, most real networks have nodes surrounded by incident edges with associated weights"],[2,"that are heterogeneously distributed and correlated between them."]],"w":21},{"k":"cf3b477b","o":52,"s":"국소 요동 (Local Fluctuations)","en":"The fingerprint of these correlations is observed in the nontrivial dependence between weights and topology (5).","ko":"이러한 상관의 지문(fingerprint)은 가중치와 위상 사이의 자명하지 않은 의존성에서 관찰된다 (5).","c":[[0,"The fingerprint of these correlations is observed in the nontrivial dependence between weights and topology (5)."]],"w":16},{"k":"fdfb9657","o":53,"s":"국소 요동 (Local Fluctuations)","en":"The better a node is connected to the rest of the network, the higher the weight of its edges so that the strength tends to grow superlinearly with the degree.","ko":"노드가 나머지 네트워크에 더 잘 연결될수록 그 엣지의 가중치가 높아지며, 그리하여 강도는 차수에 대해 초선형적(superlinear)으로 증가하는 경향이 있다.","c":[[0,"The better a node is connected to the rest of the network"],[1,"the higher the weight of its edges"],[2,"so that the strength tends to grow superlinearly with the degree."]],"w":30},{"k":"da71b810","o":54,"s":"국소 요동 (Local Fluctuations)","en":"However, the strength alone is not enough to capture the weighted structure of nodes even at the local level.","ko":"그러나 강도만으로는 국소 수준에서조차 노드의 가중 구조를 포착하기에 충분하지 않다.","c":[[0,"However, the strength alone is not enough to capture the weighted structure of nodes even at the local level."]],"w":19},{"k":"b0b62e25","o":55,"s":"국소 요동 (Local Fluctuations)","en":"We need to introduce some measure of the fluctuations of the weights attached to a given node, and we want to do it at the local level in relative terms so that each node could independently assess the importance of its connections.","ko":"우리는 주어진 노드에 부착된 가중치의 요동에 대한 어떤 척도를 도입할 필요가 있으며, 각 노드가 자신의 연결의 중요도를 독립적으로 평가할 수 있도록 이를 국소 수준에서 상대적인 관점으로 수행하고자 한다.","c":[[0,"We need to introduce some measure of the fluctuations of the weights"],[1,"attached to a given node,"],[0,"and we want to do it at the local level in relative terms"],[1,"so that each node could independently assess the importance of its connections."]],"w":42,"skel":"We need to introduce some measure …, and we want to do it at the local level","fx":1},{"k":"287cda3f","o":56,"s":"국소 요동 (Local Fluctuations)","en":"To this end, we first normalize the weights of edges linking node i with its neighbors as pij = ωij/si, being si the strength of node i and wij the weight of its connections to its neighbor j.","ko":"이를 위해 우리는 먼저 노드 i를 그 이웃과 연결하는 엣지의 가중치를 pij = ωij/si로 정규화(normalize)하는데, 여기서 si는 노드 i의 강도이고 wij는 이웃 j로의 연결의 가중치이다.","c":[[0,"To this end"],[1,"we first normalize the weights of edges linking node i with its neighbors as pij = ωij/si"],[1,"being si the strength of node i and wij the weight of its connections to its neighbor j."]],"w":38},{"k":"dc5c6b53","o":57,"s":"국소 요동 (Local Fluctuations)","en":"Then, by using the disparity function defined in Materials and Methods, it is possible to see that, even at the local level defined by the edges adjacent to a single node, a few of those edges carry a disproportionate fraction pij of the node's strength, with the remaining edges carrying just a small fraction of the node's strength (17, 18).","ko":"그다음, 재료 및 방법(Materials and Methods)에서 정의된 격차 함수(disparity function)를 사용하면, 단일 노드에 인접한 엣지로 정의되는 국소 수준에서조차 그 엣지 중 소수가 노드 강도의 불균형한 비율 pij를 담당하고 나머지 엣지는 노드 강도의 작은 비율만을 담당함을 알 수 있다 (17, 18).","c":[[0,"Then, by using the disparity function defined in Materials and Methods, it is possible to see"],[1,"that,"],[2,"even at the local level defined by the edges adjacent to a single node,"],[1,"a few of those edges carry a disproportionate fraction pij of the node's strength,"],[2,"with the remaining edges carrying just a small fraction of the node's strength (17, 18)."]],"w":60,"skel":"it is possible to see that a few of those edges carry a disproportionate fraction","fx":1},{"k":"f4662581","o":58,"s":"국소 요동 (Local Fluctuations)","en":"Being more specific, we are interested in all edges with weights representing a significant fraction of the local strength and weight magnitude of each given node.","ko":"보다 구체적으로, 우리는 각 노드의 국소 강도 및 가중치 크기의 유의한 비율을 나타내는 가중치를 지닌 모든 엣지에 관심이 있다.","c":[[0,"Being more specific"],[0,"we are interested in all edges with weights representing a significant fraction of the local strength and weight magnitude of each given node."]],"w":26},{"k":"27fb56bd","o":59,"s":"국소 요동 (Local Fluctuations)","en":"However, local heterogeneities could simply be produced by random fluctuations.","ko":"그러나 국소 이질성은 단순히 무작위 요동에 의해 생성될 수도 있다.","c":[[0,"However, local heterogeneities could simply be produced by random fluctuations."]],"w":10},{"k":"9e823fa6","o":60,"s":"국소 요동 (Local Fluctuations)","en":"It is then fundamental to introduce a null model that informs us about the random expectation for the distribution of weights associated to the connections of a particular node.","ko":"따라서 특정 노드의 연결에 결부된 가중치 분포에 대한 무작위 기댓값을 알려 주는 귀무 모형을 도입하는 것이 근본적으로 중요하다.","c":[[0,"It is then fundamental to introduce a null model"],[2,"that informs us about the random expectation for the distribution of weights associated to the connections of a particular node."]],"w":29},{"k":"d282e8a9","o":61,"s":"국소 요동 (Local Fluctuations)","en":"Empirical values not statistically compatible with the null model define, on a node-by-node basis, whether the observed weight heterogeneity and intensity are statistically significant and define the relevant part of the signal due to specific and relevant organizing principles of the network structure.","ko":"귀무 모형과 통계적으로 양립하지 않는 경험적 값들은, 노드별로 관측된 가중치 이질성과 세기가 통계적으로 유의한지를 규정하며 네트워크 구조의 특정하고 유의미한 조직 원리에 기인하는 신호의 유의미한 부분을 규정한다.","c":[[0,"Empirical values"],[1,"not statistically compatible with the null model"],[0,"define, on a node-by-node basis,"],[1,"whether the observed weight heterogeneity and intensity are statistically significant"],[0,"and define the relevant part of the signal"],[1,"due to specific and relevant organizing principles of the network structure."]],"w":43,"skel":"Empirical values … define whether …, and define the relevant part of the signal","fx":1},{"k":"5167488f","o":62,"s":"국소 요동 (Local Fluctuations)","en":"This procedure would determine without arbitrariness how many connections for every node belong to the backbone of connections that carry a statistically disproportionate weight—be they one, zero, or many—providing sparse subnetworks of connected links selected according to the total amount of weight we intend to characterize.","ko":"이 절차는 모든 노드에 대해 통계적으로 불균형한 가중치를 지닌 연결의 백본에 속하는 연결이 몇 개인지—그것이 하나이든, 0개이든, 여럿이든—임의성 없이 결정하며, 우리가 특징짓고자 하는 가중치의 총량에 따라 선택된, 연결된 링크의 성긴(sparse) 부분 네트워크를 제공한다.","c":[[0,"This procedure would determine without arbitrariness"],[1,"how many connections for every node belong to the backbone of connections"],[2,"that carry a statistically disproportionate weight"],[3,"—be they one, zero, or many—"],[1,"providing sparse subnetworks of connected links"],[2,"selected according to the total amount of weight we intend to characterize."]],"w":46,"skel":"This procedure would determine how many connections belong to the backbone","fx":1},{"k":"538ed0c1","o":63,"s":"국소 요동 (Local Fluctuations)","en":"This reduction scheme necessarily encodes a wealth of information because the reduced network not only contains the links carrying the largest weight in the network, but also all links that can be considered, according to a predefined statistical significance level, to define the relevant structure (signal) generated by the weight and strength assignment with respect to the simple randomness of the null hypothesis.","ko":"이 축소 방식은 필연적으로 풍부한 정보를 부호화하는데, 이는 축소된 네트워크가 네트워크에서 가장 큰 가중치를 지닌 링크뿐만 아니라, 사전에 정의된 통계적 유의수준에 따라 귀무 가설(null hypothesis)의 단순한 무작위성에 대한 가중치 및 강도 배정에 의해 생성된 유의미한 구조(신호)를 규정하는 것으로 간주될 수 있는 모든 링크도 담고 있기 때문이다.","c":[[0,"This reduction scheme necessarily encodes a wealth of information"],[1,"because the reduced network not only contains the links carrying the largest weight in the network,"],[1,"but also all links"],[2,"that can be considered, according to a predefined statistical significance level, to define the relevant structure (signal)"],[3,"generated by the weight and strength assignment with respect to the simple randomness of the null hypothesis."]],"w":63,"skel":"This scheme encodes information because the network contains not only A but also B","fx":1},{"k":"ab04286a","o":64,"s":"국소 요동 (Local Fluctuations)","en":"An important aspect of this construction is that the ensuing reduction algorithm does not belittle small nodes in terms of strength and then offers a practical procedure to reduce the number of connections taking into account all of the scales present in the system.","ko":"이 구성의 중요한 측면은 그에 따르는 축소 알고리즘이 강도의 관점에서 작은 노드를 경시하지 않으며, 그리하여 시스템에 존재하는 모든 스케일을 고려하여 연결의 수를 줄이는 실용적 절차를 제공한다는 점이다.","c":[[0,"An important aspect of this construction is"],[1,"that the ensuing reduction algorithm does not belittle small nodes in terms of strength"],[1,"and then offers a practical procedure to reduce the number of connections"],[2,"taking into account all of the scales present in the system."]],"w":44,"skel":"An important aspect … is that the algorithm does not belittle small nodes and offers a procedure","fx":1},{"k":"e1956159","o":65,"s":"격차 필터 (The Disparity Filter)","en":"In the following, we discuss the disparity filter for undirected weighted networks, although it is also applicable to directed ones as reported in the supporting information (SI) Appendix.","ko":"이하에서 우리는 무방향 가중 네트워크에 대한 격차 필터(disparity filter)를 논의하는데, 이는 보충 정보(SI) 부록에 보고된 바와 같이 방향 네트워크에도 적용 가능하다.","c":[[0,"In the following"],[1,"we discuss the disparity filter for undirected weighted networks"],[2,"although it is also applicable to directed ones as reported in the supporting information (SI) Appendix."]],"w":28},{"k":"a27d3ed9","o":66,"s":"격차 필터 (The Disparity Filter)","en":"The null model that we use to define anomalous fluctuations provides the expectation for the disparity measure of a given node in a pure random case.","ko":"이상 요동(anomalous fluctuation)을 정의하기 위해 우리가 사용하는 귀무 모형은 순수 무작위 경우에 주어진 노드의 격차 척도(disparity measure)에 대한 기댓값을 제공한다.","c":[[0,"The null model"],[2,"that we use to define anomalous fluctuations provides the expectation for the disparity measure of a given node in a pure random case."]],"w":26},{"k":"b695f0c4","o":67,"s":"격차 필터 (The Disparity Filter)","en":"It is based on the following null hypothesis: the normalized weights that correspond to the connections of a certain node of degree k are produced by a random assignment from a uniform distribution.","ko":"이는 다음의 귀무 가설에 기반한다: 차수 k를 지닌 어떤 노드의 연결에 대응하는 정규화된 가중치는 균등 분포(uniform distribution)로부터의 무작위 배정에 의해 생성된다.","c":[[0,"It is based on the following null hypothesis: the normalized weights"],[2,"that correspond to the connections of a certain node of degree k are produced by a random assignment from a uniform distribution."]],"w":33},{"k":"a969875f","o":68,"s":"격차 필터 (The Disparity Filter)","en":"To visualize this process, k−1 points are distributed with uniform probability in the interval [0, 1] so that it ends up divided into k subintervals.","ko":"이 과정을 시각화하기 위해, k-1개의 점이 구간 [0, 1]에 균등한 확률로 분포되어 결국 k개의 부분 구간으로 나뉜다.","c":[[0,"To visualize this process, k−1 points are distributed with uniform probability in the interval [0, 1]"],[2,"so that it ends up divided into k subintervals."]],"w":25},{"k":"db218397","o":69,"s":"격차 필터 (The Disparity Filter)","en":"Their lengths would represent the expected values for the k normalized weights pij according to the null hypothesis.","ko":"그 길이들은 귀무 가설에 따른 k개의 정규화된 가중치 pij에 대한 기댓값을 나타낸다.","c":[[0,"Their lengths would represent the expected values for the k normalized weights pij according to the null hypothesis."]],"w":18},{"k":"4dae9886","o":70,"s":"격차 필터 (The Disparity Filter)","en":"The probability density function for one of these variables taking a particular value x is","ko":"이 변수 중 하나가 특정 값 x를 취할 확률 밀도 함수(probability density function)는 다음과 같다.","c":[[0,"The probability density function for one of these variables taking a particular value x is"]],"w":15},{"k":"80328e92","o":71,"s":"격차 필터 (The Disparity Filter)","en":"which depends on the degree k of the node under consideration.","ko":"이는 고려 중인 노드의 차수 k에 의존한다.","c":[[0,"which depends on the degree k of the node under consideration."]],"w":11},{"k":"929a9969","o":72,"s":"격차 필터 (The Disparity Filter)","en":"In Materials and Methods we provide a detailed analysis of the null model with respect to the actual weight distribution in two real-world networks.","ko":"재료 및 방법에서 우리는 두 실제 네트워크의 실제 가중치 분포에 대한 귀무 모형의 상세한 분석을 제공한다.","c":[[0,"In Materials and Methods we provide a detailed analysis of the null model with respect to the actual weight distribution in two real-world networks."]],"w":24},{"k":"508b032d","o":73,"s":"격차 필터 (The Disparity Filter)","en":"The disparity filter proceeds by identifying which links for each node should be preserved in the network.","ko":"격차 필터는 각 노드에 대해 어떤 링크가 네트워크에 보존되어야 하는지를 식별함으로써 진행된다.","c":[[0,"The disparity filter proceeds by identifying"],[2,"which links for each node should be preserved in the network."]],"w":17},{"k":"14b9601d","o":74,"s":"격차 필터 (The Disparity Filter)","en":"The null model allows this discrimination by the calculation for each edge of a given node of the probability αij that its normalized weight pij is compatible with the null hypothesis.","ko":"귀무 모형은 주어진 노드의 각 엣지에 대해 그 정규화된 가중치 pij가 귀무 가설과 양립할 확률 αij를 계산함으로써 이 판별을 가능하게 한다.","c":[[0,"The null model allows this discrimination by the calculation for each edge of a given node of the probability αij"],[2,"that its normalized weight pij is compatible with the null hypothesis."]],"w":31},{"k":"8205883e","o":75,"s":"격차 필터 (The Disparity Filter)","en":"In statistical inference, this concept is known as the p value, the probability that, if the null hypothesis is true, one obtains a value for the variable under consideration larger than or equal to the observed one.","ko":"통계적 추론에서 이 개념은 p값(p value)으로 알려져 있는데, 이는 귀무 가설이 참일 때 고려 중인 변수에 대해 관측값보다 크거나 같은 값을 얻을 확률이다.","c":[[0,"In statistical inference"],[0,"this concept is known as the p value, the probability, that"],[1,"if the null hypothesis is true"],[1,"one obtains a value for the variable under consideration larger than or equal to the observed one."]],"w":37},{"k":"6f796ef5","o":76,"s":"격차 필터 (The Disparity Filter)","en":"By imposing a significance level α, the links that carry weights that can be considered not compatible with a random distribution can be filtered out with an certain statistical significance.","ko":"유의수준(significance level) α를 부과함으로써, 무작위 분포와 양립하지 않는 것으로 간주될 수 있는 가중치를 지닌 링크를 일정한 통계적 유의성으로 걸러 낼 수 있다.","c":[[0,"By imposing a significance level α, the links"],[2,"that carry weights"],[3,"that can be considered not compatible with a random distribution can be filtered out with an certain statistical significance."]],"w":30},{"k":"10236022","o":77,"s":"격차 필터 (The Disparity Filter)","en":"All the links with αij < α reject the null hypothesis and can be considered as significant heterogeneities due to the network-organizing principles.","ko":"αij < α인 모든 링크는 귀무 가설을 기각하며 네트워크 조직 원리에 기인하는 유의한 이질성으로 간주될 수 있다.","c":[[0,"All the links with αij < α reject the null hypothesis and can be considered as significant heterogeneities due to the network-organizing principles."]],"w":23},{"k":"25b79b50","o":78,"s":"격차 필터 (The Disparity Filter)","en":"By changing the significance level we can filter out the links progressively focusing on more relevant edges.","ko":"유의수준을 변화시킴으로써 우리는 보다 유의미한 엣지에 점진적으로 초점을 맞추어 링크를 걸러 낼 수 있다.","c":[[0,"By changing the significance level we can filter out the links progressively focusing on more relevant edges."]],"w":17},{"k":"fb0c6ce4","o":79,"s":"격차 필터 (The Disparity Filter)","en":"The statistically relevant edges will be those whose weights satisfy the relation","ko":"통계적으로 유의미한 엣지는 그 가중치가 다음 관계를 만족하는 엣지다.","c":[[0,"The statistically relevant edges will be those"],[2,"whose weights satisfy the relation"]],"w":12},{"k":"17df1947","o":80,"s":"격차 필터 (The Disparity Filter)","en":"Note that this expression depends on the number of connections k of the node to which the link under consideration is attached.","ko":"이 식은 고려 중인 링크가 부착된 노드의 연결 수 k에 의존함에 유의하라.","c":[[0,"Note"],[2,"that this expression depends on the number of connections k of the node to"],[3,"which the link under consideration is attached."]],"w":22},{"k":"b4575a43","o":81,"s":"격차 필터 (The Disparity Filter)","en":"The multiscale backbone is then obtained by preserving all the links that satisfy the above criterion for at least one of the two nodes at the ends of the link while discounting the rest.*","ko":"이후 다중스케일 백본은 링크 양 끝의 두 노드 중 적어도 하나에 대해 위 기준을 만족하는 모든 링크를 보존하고 나머지는 배제함으로써 얻어진다.*","c":[[0,"The multiscale backbone is then obtained by preserving all the links"],[2,"that satisfy the above criterion for at least one of the two nodes at the ends of the link"],[3,"while discounting the rest.*"]],"w":34},{"k":"68f15a9b","o":82,"s":"격차 필터 (The Disparity Filter)","en":"In this way, small nodes in terms of strength are not belittled so that the system remains in the percolated phase.","ko":"이렇게 함으로써 강도의 관점에서 작은 노드가 경시되지 않으므로 시스템은 스미기 상(percolated phase)에 머무른다.","c":[[0,"In this way, small nodes in terms of strength are not belittled"],[2,"so that the system remains in the percolated phase."]],"w":21},{"k":"9c56b4b9","o":83,"s":"격차 필터 (The Disparity Filter)","en":"In other words, we single out the relevant part of the network that carries the statistically relevant signal provided by the distribution with respect to local uniform randomness null hypotheses.","ko":"다시 말해, 우리는 국소 균등 무작위성 귀무 가설에 대한 분포가 제공하는 통계적으로 유의미한 신호를 지닌 네트워크의 유의미한 부분을 골라낸다.","c":[[0,"In other words"],[1,"we single out the relevant part of the network"],[2,"that carries the statistically relevant signal provided by the distribution with respect to local uniform randomness null hypotheses."]],"w":30},{"k":"fd7dc54b","o":84,"s":"격차 필터 (The Disparity Filter)","en":"By choosing a constant significance level α we obtain a homogeneous criterion that allows us to compare inhomogeneities in nodes with different magnitudes in degree and strength.","ko":"일정한 유의수준 α를 선택함으로써 우리는 차수와 강도의 크기가 다른 노드들의 비균질성을 비교할 수 있게 하는 균질한 기준을 얻는다.","c":[[0,"By choosing a constant significance level α we obtain a homogeneous criterion"],[2,"that allows us to compare inhomogeneities in nodes with different magnitudes in degree and strength."]],"w":27},{"k":"e932c020","o":85,"s":"격차 필터 (The Disparity Filter)","en":"By decreasing the statistical confidence, more restrictive subsets are obtained, giving place to a potential hierarchy of backbones.","ko":"통계적 신뢰도를 낮춤으로써 더 제한적인 부분 집합이 얻어지며, 이는 잠재적인 백본의 계층을 낳는다.","c":[[0,"By decreasing the statistical confidence, more restrictive subsets are obtained"],[1,"giving place to a potential hierarchy of backbones."]],"w":18},{"k":"7bfebfff","o":86,"s":"격차 필터 (The Disparity Filter)","en":"This strategy will be efficient whenever the level of heterogeneity is high and weights are locally correlated.","ko":"이 전략은 이질성의 수준이 높고 가중치가 국소적으로 상관될 때마다 효율적일 것이다.","c":[[0,"This strategy will be efficient whenever the level of heterogeneity is high and weights are locally correlated."]],"w":17},{"k":"aec5a2e8","o":87,"s":"격차 필터 (The Disparity Filter)","en":"Otherwise, the pruning could lose its hierarchical attribute producing results analogous to the global threshold algorithm (see section on networks with uncorrelated weights in SI Appendix).","ko":"그렇지 않은 경우, 가지치기는 그 계층적 속성을 잃고 전역 임계값 알고리즘과 유사한 결과를 낳을 수 있다(SI 부록의 비상관 가중치 네트워크에 관한 절 참조).","c":[[0,"Otherwise"],[0,"the pruning could lose its hierarchical attribute producing results analogous to the global threshold algorithm (see section on networks with uncorrelated weights in SI Appendix)."]],"w":26},{"k":"f7693b0e","o":88,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"To test the performance of the disparity filter algorithm, we apply it to the extraction of the multiscale backbone of two real-world networks.","ko":"격차 필터 알고리즘의 성능을 검증하기 위해, 우리는 이를 두 실제 네트워크의 다중스케일 백본 추출에 적용한다.","c":[[0,"To test the performance of the disparity filter algorithm, we apply it to the extraction of the multiscale backbone of two real-world networks."]],"w":23},{"k":"3c27c783","o":89,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"We also compare the obtained results with the reduced networks obtained by applying a simple global threshold strategy that preserves connections above a given weight ωc.","ko":"우리는 또한 얻어진 결과를, 주어진 가중치 ωc를 초과하는 연결을 보존하는 단순한 전역 임계값 전략을 적용하여 얻은 축소 네트워크와 비교한다.","c":[[0,"We also compare the obtained results with the reduced networks obtained by applying a simple global threshold strategy"],[2,"that preserves connections above a given weight ωc."]],"w":26},{"k":"95262a62","o":90,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"As examples of strongly disordered networks, we consider the domestic nonstop segment of the U.S. airport transportation system for the year 2006 (http://www.transtats.bts.gov) and the Florida Bay ecosystem in the dry season (19).","ko":"강한 무질서 네트워크의 예로서, 우리는 2006년 미국 항공 교통 시스템의 국내 직항 부문(http://www.transtats.bts.gov)과 건기의 플로리다 만 생태계(19)를 고려한다.","c":[[0,"As examples of strongly disordered networks"],[1,"we consider the domestic nonstop segment of the U.S. airport transportation system for the year 2006 (http://www.transtats.bts.gov) and the Florida Bay ecosystem in the dry season (19)."]],"w":33},{"k":"a5618a31","o":91,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"The U.S. airport transportation system for the year 2006 gathers the data reported by air carriers about flights between 1,078 U.S. airports connected by 11,890 links.","ko":"2006년 미국 항공 교통 시스템은 11,890개의 링크로 연결된 1,078개의 미국 공항 간 항공편에 관해 항공사가 보고한 데이터를 수집한다.","c":[[0,"The U.S. airport transportation system for the year 2006 gathers the data reported by air carriers about flights between 1"],[1,"078 U.S. airports connected by 11, 890 links."]],"w":26},{"k":"ebda99aa","o":92,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"Weights are given by the number of passengers traveling the corresponding route in the year symmetrized to produce an undirected representation.","ko":"가중치는 해당 노선을 그해에 이용한 승객 수로 주어지며, 무방향 표현을 만들기 위해 대칭화된다.","c":[[0,"Weights are given by the number of passengers traveling the corresponding route in the year symmetrized to produce an undirected representation."]],"w":21},{"k":"45346a50","o":93,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"The resulting graph has a high density of connections, ⟨k⟩ = 22, making difficult both its analysis and visualization.","ko":"그 결과 그래프는 높은 연결 밀도 ⟨k ⟩ = 22를 지녀 분석과 시각화가 모두 어렵다.","c":[[0,"The resulting graph has a high density of connections, ⟨k⟩ = 22"],[1,"making difficult both its analysis and visualization."]],"w":19},{"k":"358dff16","o":94,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"The Florida Bay food web comes from the ATLSS Project by the University of Maryland (http://www.cbl.umces.edu/atlss.html).","ko":"플로리다 만 먹이망은 메릴랜드 대학교의 ATLSS 프로젝트에서 나온 것이다(http://www.cbl.umces.edu/atlss.html).","c":[[0,"The Florida Bay food web comes from the ATLSS Project by the University of Maryland (http://www.cbl.umces.edu/atlss.html)."]],"w":16},{"k":"0d7540ec","o":95,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"Trophic interactions in food webs are symbolized by directed and weighted links representing carbon flows (mg C y−1 m−2) between species.","ko":"먹이망에서 영양 상호작용(trophic interaction)은 종 사이의 탄소 흐름(mg C y⁻¹ m⁻²)을 나타내는 방향 가중 링크로 상징된다.","c":[[0,"Trophic interactions in food webs are symbolized by directed and weighted links representing carbon flows (mg C y−1 m−2) between species."]],"w":21},{"k":"79a1cda6","o":96,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"The network consists of a total of 122 separate components joined by 1,799 directed links.","ko":"이 네트워크는 1,799개의 방향 링크로 연결된 총 122개의 개별 구성 요소로 이루어진다.","c":[[0,"The network consists of a total of 122 separate components joined by 1,799 directed links."]],"w":15},{"k":"c0516f7d","o":97,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"In Table 1 and Fig. 1, we show statistics for the relative sizes—in terms of fractions of total weight WT, nodes NT, and edges ET—preserved in the backbones when the network is filtered by the disparity filter and by the application of a global threshold, respectively.","ko":"표 1과 그림 1에서, 우리는 네트워크가 각각 격차 필터와 전역 임계값 적용으로 필터링될 때 백본에 보존되는 상대적 크기—총 가중치 WT, 노드 NT, 엣지 ET의 비율의 관점—에 대한 통계를 제시한다.","c":[[0,"In Table 1 and Fig. 1, we show statistics for the relative sizes"],[1,"—in terms of fractions of total weight WT, nodes NT, and edges ET—"],[0,"preserved in the backbones"],[1,"when the network is filtered by the disparity filter and by the application of a global threshold, respectively."]],"w":46,"skel":"we show statistics for the relative sizes … preserved in the backbones","fx":1},{"k":"1ab1c9d1","o":98,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"The disparity filter reduces the number of edges significantly even when the significance level α is close to 1, keeping at the same time almost all of the weight and a high fraction of nodes.","ko":"격차 필터는 유의수준 α가 1에 가까울 때조차 엣지의 수를 유의하게 줄이는 동시에 거의 모든 가중치와 높은 비율의 노드를 유지한다.","c":[[0,"The disparity filter reduces the number of edges significantly even"],[2,"when the significance level α is close to 1"],[2,"keeping at the same time almost all of the weight and a high fraction of nodes."]],"w":35},{"k":"6b6e78c6","o":99,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"Smaller values of α reduce even more the number of edges but, interestingly, the total weight and number of nodes remain nearly constant.","ko":"더 작은 α 값은 엣지의 수를 한층 더 줄이지만, 흥미롭게도 총 가중치와 노드 수는 거의 일정하게 유지된다.","c":[[0,"Smaller values of α reduce even more the number of edges but, interestingly, the total weight and number of nodes remain nearly constant."]],"w":23},{"k":"b74396e5","o":100,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"Only for very low values of α—when the filter becomes very restrictive—do the total weight and number of nodes start decreasing significantly.","ko":"매우 낮은 α 값에서—필터가 매우 제한적이 될 때—에만 총 가중치와 노드 수가 유의하게 감소하기 시작한다.","c":[[0,"Only for very low values of α"],[1,"—when the filter becomes very restrictive"],[1,"—do the total weight and number of nodes start decreasing significantly."]],"w":22},{"k":"e0478d74","o":101,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"In the case of the airports network, values around α ≈ 0.05 extract backbones with >80% of the total weight, 66% of nodes, and only 17% of edges.","ko":"공항 네트워크의 경우, α ≈ 0.05 부근의 값은 총 가중치의 80% 초과, 노드의 66%, 그리고 엣지의 17%에 불과한 백본을 추출한다.","c":[[0,"In the case of the airports network"],[1,"values around α ≈ 0.05 extract backbones with >80% of the total weight"],[1,"66% of nodes"],[1,"and only 17% of edges."]],"w":28},{"k":"a5092d4f","o":102,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"The global threshold filter, on the other hand, is not able to maintain the majority of the nodes in the backbone for similar values of retained weight or edges, as it is clearly seen in the first and second columns of Fig. 1, respectively.","ko":"반면 전역 임계값 필터는 유지된 가중치나 엣지의 유사한 값에 대해 백본에 대다수의 노드를 유지하지 못하는데, 이는 각각 그림 1의 첫 번째 및 두 번째 열에서 명확히 볼 수 있다.","c":[[0,"The global threshold filter, on the other hand, is not able to maintain the majority of the nodes in the backbone"],[1,"for similar values of retained weight or edges,"],[1,"as it is clearly seen in the first and second columns of Fig. 1, respectively."]],"w":44,"skel":"The global threshold filter … is not able to maintain the majority of the nodes","fx":1},{"k":"05731748","o":103,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"It is particularly interesting to analyze the behavior of the topological properties of the filtered network at increasing levels of reduction.","ko":"축소 수준이 높아짐에 따라 필터링된 네트워크의 위상적 성질의 거동을 분석하는 것은 특히 흥미롭다.","c":[[0,"It is particularly interesting to analyze the behavior of the topological properties of the filtered network at increasing levels of reduction."]],"w":21},{"k":"63f000dc","o":104,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"Fig. 2 shows the evolution of the cumulative degree distribution, i.e., Pc(k) = Σ_{k'≥k} P(k'), for different values of α (Left Top) and ωc (Right Top), respectively.","ko":"그림 2는 각각 다른 α 값(왼쪽 상단)과 ωc 값(오른쪽 상단)에 대한 누적 차수 분포(cumulative degree distribution), 즉 Pc(k) = Σk' ≥ k P(k')의 변화를 보여 준다.","c":[[0,"Fig. 2 shows the evolution of the cumulative degree distribution, i.e."],[1,"Pc(k) = Σ_{k'≥k} P(k')"],[1,"for different values of α (Left Top) and ωc (Right Top), respectively."]],"w":27},{"k":"e9236226","o":105,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"The original airports network is heavy tailed although it cannot be fitted by a pure power-law function.","ko":"원래 공항 네트워크는 순수 거듭제곱 법칙(power-law) 함수로 적합될 수는 없으나 두꺼운 꼬리를 지닌다.","c":[[0,"The original airports network is heavy tailed"],[2,"although it cannot be fitted by a pure power-law function."]],"w":17},{"k":"0838bf26","o":106,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"Interestingly, the disparity filter reveals a clear power-law behavior as α decreases, with an exponent γ ≈ 2.3.","ko":"흥미롭게도, 격차 필터는 α가 감소함에 따라 지수 γ ≈ 2.3의 명확한 거듭제곱 법칙 거동을 드러낸다.","c":[[0,"Interestingly, the disparity filter reveals a clear power-law behavior as α decreases, with an exponent γ ≈ 2.3."]],"w":18},{"k":"60a1bfdf","o":107,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"On the other hand, the global threshold filter produces subgraphs with a degree of distribution similar to the original one, but with a sharp cutoff that becomes smaller as the filter gets more restrictive.","ko":"반면 전역 임계값 필터는 원래와 유사한 차수 분포를 지닌 부분그래프를 생성하지만, 필터가 더 제한적이 될수록 작아지는 급격한 절단을 동반한다.","c":[[0,"On the other hand"],[1,"the global threshold filter produces subgraphs with a degree of distribution similar to the original one"],[1,"but with a sharp cutoff"],[2,"that becomes smaller as the filter gets more restrictive."]],"w":34},{"k":"ccfb9649","o":108,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"However, the weight distribution P(ω) for the disparity filter (Left Middle) shows that almost all scales are kept during the filtering process and only the region of very small weights is affected, in contrast to the global threshold filter that, by definition, cuts P(ω) off below ωc (Right Middle).","ko":"그러나 격차 필터에 대한 가중치 분포 P(ω)(왼쪽 중단)는 필터링 과정 동안 거의 모든 스케일이 유지되고 매우 작은 가중치 영역만 영향을 받음을 보여 주는데, 이는 정의상 ωc 미만에서 P(ω)를 절단하는 전역 임계값 필터(오른쪽 중단)와 대조된다.","c":[[0,"However, the weight distribution P(ω) for the disparity filter (Left Middle) shows"],[1,"that almost all scales are kept during the filtering process"],[1,"and only the region of very small weights is affected,"],[1,"in contrast to the global threshold filter"],[2,"that, by definition, cuts P(ω) off below ωc (Right Middle)."]],"w":49,"skel":"the weight distribution P(ω) … shows that almost all scales are kept","fx":1},{"k":"aa8f7255","o":109,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"In Fig. 2 (Bottom), we show the clustering coefficient C measured as the average over nodes of degree >1.","ko":"그림 2(하단)에서 우리는 차수가 1보다 큰 노드에 대한 평균으로 측정된 뭉침 계수 C를 보여 준다.","c":[[0,"In Fig. 2 (Bottom), we show the clustering coefficient C measured as the average over nodes of degree >1."]],"w":19},{"k":"d2bc64fb","o":110,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"It remains nearly constant in both filters until they become too restrictive, in which case clustering goes to zero.†","ko":"이는 두 필터 모두에서 필터가 지나치게 제한적이 되기 전까지 거의 일정하게 유지되며, 지나치게 제한적이 될 경우 뭉침은 0으로 간다.†","c":[[0,"It remains nearly constant in both filters until they become too restrictive, in"],[2,"which case clustering goes to zero.†"]],"w":19},{"k":"2d3df636","o":111,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"In the case of the disparity filter, clustering remains constant up to values of α ≈ 0.01.","ko":"격차 필터의 경우, 뭉침은 α ≈ 0.01 값까지 일정하게 유지된다.","c":[[0,"In the case of the disparity filter"],[1,"clustering remains constant up to values of α ≈ 0.01."]],"w":17},{"k":"b484b6e9","o":112,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"This is precisely the value below which both the number of nodes and the weight in the backbone start decreasing significantly.","ko":"이는 바로 그 아래에서 백본의 노드 수와 가중치가 모두 유의하게 감소하기 시작하는 값이다.","c":[[0,"This is precisely the value below"],[2,"which both the number of nodes and the weight in the backbone start decreasing significantly."]],"w":21},{"k":"805634e1","o":113,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"Therefore, we can conclude that values of α in the range [0.01, 0.5] are optimal, in the sense that backbones in this region have a large proportion of nodes and weight, the same clustering of the original network, and a stable stationary degree distribution, all with a very small number of connections compared with the original network.","ko":"따라서 우리는 [0.01, 0.5] 범위의 α 값이 최적이라고 결론지을 수 있는데, 이 범위의 백본이 원래 네트워크에 비해 매우 적은 수의 연결만으로 큰 비율의 노드와 가중치, 원래 네트워크와 동일한 뭉침, 그리고 안정적인 정상(stationary) 차수 분포를 지닌다는 의미에서 그러하다.","c":[[0,"Therefore, we can conclude"],[1,"that values of α in the range [0.01, 0.5] are optimal,"],[2,"in the sense that backbones in this region have"],[3,"a large proportion of nodes and weight,"],[3,"the same clustering of the original network,"],[3,"and a stable stationary degree distribution,"],[2,"all with a very small number of connections compared with the original network."]],"w":57,"skel":"we can conclude that values of α … are optimal","fx":1},{"k":"79ebe049","o":114,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"It is important to stress that the disparity filtering also includes the connections with the largest weight present in the system.","ko":"격차 필터링이 시스템에 존재하는 가장 큰 가중치를 지닌 연결 또한 포함한다는 점을 강조하는 것이 중요하다.","c":[[0,"It is important to stress"],[2,"that the disparity filtering also includes the connections with the largest weight present in the system."]],"w":21},{"k":"d0668644","o":115,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"This is because the heavy tail of the P(ω) distribution is mainly determined by relevant large-scale weight.","ko":"이는 P(ω) 분포의 두꺼운 꼬리가 주로 유의미한 대규모 가중치에 의해 결정되기 때문이다.","c":[[0,"This is"],[2,"because the heavy tail of the P(ω) distribution is mainly determined by relevant large-scale weight."]],"w":17},{"k":"9048e5e8","o":116,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"This is clearly illustrated in Fig. 3, where we show that for statistical significance levels up to α ≃ 10−3, all of the edges included in the 10–20% of the P(ω) tail are included in the extracted multiscale backbone.","ko":"이는 그림 3에 명확히 나타나 있는데, 여기서 우리는 α ≃ 10⁻³까지의 통계적 유의수준에 대해 P(ω) 꼬리의 10–20%에 포함된 모든 엣지가 추출된 다중스케일 백본에 포함됨을 보인다.","c":[[0,"This is clearly illustrated in Fig. 3"],[2,"where we show"],[3,"that for statistical significance levels up to α ≃ 10−3"],[3,"all of the edges included in the 10–20% of the P(ω) tail are included in the extracted multiscale backbone."]],"w":39},{"k":"8cee84bd","o":117,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"As an illustration of the efficacy of the disparity filter, we visualize the obtained multiscale backbone in Fig. 4.","ko":"격차 필터의 효능을 예시하기 위해, 우리는 얻어진 다중스케일 백본을 그림 4에 시각화한다.","c":[[0,"As an illustration of the efficacy of the disparity filter, we visualize the obtained multiscale backbone in Fig. 4."]],"w":19},{"k":"94421b63","o":118,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"In the case of the U.S. airport network we use the significance value α = 0.003 [see entry (b) in Table 1 and Fig. 3].","ko":"미국 공항 네트워크의 경우 우리는 유의값 α = 0.003을 사용한다[표 1과 그림 3의 항목 (b) 참조].","c":[[0,"In the case of the U.S. airport network we use the significance value α = 0.003 [see entry (b) in Table 1 and Fig. 3]."]],"w":25},{"k":"28db7240","o":119,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"Interestingly, the disparity filter offers a perspective of the network that reveals its geographic constraints (notice that each node is placed in the plane according to its actual coordinates on the earth).","ko":"흥미롭게도, 격차 필터는 네트워크의 지리적 제약을 드러내는 관점을 제공한다(각 노드가 지구상의 실제 좌표에 따라 평면에 배치되어 있음에 유의하라).","c":[[0,"Interestingly"],[0,"the disparity filter offers a perspective of the network"],[1,"that reveals its geographic constraints (notice"],[2,"that each node is placed in the plane according to its actual coordinates on the earth)."]],"w":32},{"k":"d9222c5b","o":120,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"It is possible to identify local hubs with very well defined basins of attraction made of small airports connected to them (21), a star-like pattern that is particularly clear in Alaska airports or midwestern cities.","ko":"그에 연결된 소규모 공항들로 이루어진 매우 잘 정의된 유인 영역(basin of attraction)을 지닌 국소 허브(local hub)를 식별하는 것이 가능하며 (21), 이는 알래스카 공항이나 중서부 도시에서 특히 뚜렷한 별 모양(star-like) 패턴이다.","c":[[0,"It is possible to identify local hubs with very well defined basins of attraction made of small airports connected to them (21)"],[1,"a star-like pattern"],[2,"that is particularly clear in Alaska airports or midwestern cities."]],"w":35},{"k":"f201d51f","o":121,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"In addition, the hierarchy of the transportation system is fully highlighted, including not just the most high flux connections but also small weight edges that are statistically significant because they represent relevant signal at the small scales.","ko":"또한 교통 시스템의 계층이 온전히 부각되는데, 여기에는 가장 높은 유량(flux)의 연결뿐만 아니라 소규모 스케일에서 유의미한 신호를 나타내기 때문에 통계적으로 유의한 작은 가중치의 엣지도 포함된다.","c":[[0,"In addition"],[0,"the hierarchy of the transportation system is fully highlighted"],[1,"including not just the most high flux connections but also small weight edges"],[2,"that are statistically significant"],[3,"because they represent relevant signal at the small scales."]],"w":37},{"k":"407d93f5","o":122,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"In this way, all important connection on the local and global level are considered at once.","ko":"이렇게 함으로써 국소 및 전역 수준의 모든 중요한 연결이 한꺼번에 고려된다.","c":[[0,"In this way, all important connection on the local and global level are considered at once."]],"w":16},{"k":"e4f3339a","o":123,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"This would not be possible with a global threshold algorithm, which would simply eliminate all connections below the scale introduced by the cutoff threshold.","ko":"이는 절단 임계값이 도입한 스케일 아래의 모든 연결을 단순히 제거해 버릴 전역 임계값 알고리즘으로는 불가능할 것이다.","c":[[0,"This would not be possible with a global threshold algorithm"],[2,"which would simply eliminate all connections below the scale introduced by the cutoff threshold."]],"w":24},{"k":"2ee442da","o":124,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"The Florida Bay food web is a directed network (see SI Appendix for an explanation of the methodology in the case of weighted directed neworks).","ko":"플로리다 만 먹이망은 방향 네트워크이다(가중 방향 네트워크의 경우 방법론에 대한 설명은 SI 부록 참조).","c":[[0,"The Florida Bay food web is a directed network (see SI Appendix for an explanation of the methodology in the case of weighted directed neworks)."]],"w":25},{"k":"8191edc8","o":125,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"We draw its multiscale backbone for α = 0.0008, which contains the top 40% of heaviest links (see entry (a) in Table 1 and Fig. 3).","ko":"우리는 α = 0.0008에 대한 그 다중스케일 백본을 그리는데, 이는 가장 무거운 링크 상위 40%를 담고 있다[표 1과 그림 3의 항목 (a) 참조].","c":[[0,"We draw its multiscale backbone for α = 0.0008"],[2,"which contains the top 40% of heaviest links (see entry (a) in Table 1 and Fig. 3)."]],"w":26},{"k":"58130df7","o":126,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"Notice that, in this case, the concentration of weight in a few links is so important that the represented disparity backbone contains approximately half of the total weight in the network.","ko":"이 경우 소수의 링크에 가중치가 집중되는 정도가 매우 커서, 표현된 격차 백본이 네트워크 총 가중치의 약 절반을 담고 있음에 유의하라.","c":[[0,"Notice, that"],[1,"in this case"],[0,"the concentration of weight in a few links is so important"],[1,"that the represented disparity backbone contains approximately half of the total weight in the network."]],"w":31},{"k":"647a1672","o":127,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"Again, star motifs are uncovered, formed by mainly incoming connections, as for the pelican, or mainly outgoing ones, bivalves.","ko":"여기서도 별 모티프(star motif)가 드러나는데, 이는 펠리컨의 경우처럼 주로 들어오는 연결로, 또는 이매패류(bivalve)의 경우처럼 주로 나가는 연결로 형성된다.","c":[[0,"Again, star motifs are uncovered, formed by mainly incoming connections, as for the pelican"],[1,"or mainly outgoing ones, bivalves."]],"w":19},{"k":"78bb45ed","o":128,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"More in general, specific subsystems dominated by significant fluxes can be easily identified, which might be evidence of an historical evolution of the network from smaller modular and disconnected structures to the complete ecosystem we observe today.","ko":"보다 일반적으로, 유의한 유량이 지배하는 특정 부분 시스템을 쉽게 식별할 수 있는데, 이는 네트워크가 더 작은 모듈적·비연결적 구조에서 오늘날 우리가 관찰하는 완전한 생태계로 진화해 온 역사적 과정의 증거일 수 있다.","c":[[0,"More in general"],[1,"specific subsystems dominated by significant fluxes can be easily identified"],[2,"which might be evidence of an historical evolution of the network from smaller modular and disconnected structures to the complete ecosystem we observe today."]],"w":37},{"k":"39d2c1ae","o":129,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"Another interesting remark refers the presence in the backbone of species with relatively few trophic links.","ko":"또 하나의 흥미로운 언급은 상대적으로 적은 영양 링크를 지닌 종이 백본에 존재한다는 점과 관련된다.","c":[[0,"Another interesting remark refers the presence in the backbone of species with relatively few trophic links."]],"w":16},{"k":"91a87736","o":130,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"Species with few connections are usually assumed to have a low impact on the ecosystems.","ko":"연결이 적은 종은 보통 생태계에 미치는 영향이 작다고 가정된다.","c":[[0,"Species with few connections are usually assumed to have a low impact on the ecosystems."]],"w":15},{"k":"df39c4fe","o":131,"s":"실제 네트워크의 다중스케일 백본 (The Multiscale Backbone of Real Networks)","en":"However, counterexamples can be found and such species may act as the structural equivalent of keystone species, whereas species with many trophic linkages may be more conceptually similar to dominant species (22).","ko":"그러나 반례를 찾을 수 있으며 그러한 종은 핵심종(keystone species)의 구조적 등가물로 작용할 수 있는 반면, 많은 영양 연결을 지닌 종은 개념적으로 우점종(dominant species)에 더 유사할 수 있다 (22).","c":[[0,"However"],[1,"counterexamples can be found and such species may act as the structural equivalent of keystone species"],[2,"whereas species with many trophic linkages may be more conceptually similar to dominant species
